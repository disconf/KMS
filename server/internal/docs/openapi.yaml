                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/SkillItem' }

  # ============================ 专家域：入驻申请 ============================

  /api/v1/expert/apply:
    post:
      tags: [expert]
      summary: 提交入驻申请
      description: |
        `certFiles` 与 `avatar` 都是上传接口返回的 **key**，不是 URL。

        已通过审核的专家重复提交返回 3xxxx；被驳回后可以再次提交。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpertApplyReq' }
      responses:
        '201':
          description: 提交成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpertApplyStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [expert]
      summary: 查询申请状态
      description: |
        被驳回时额外返回 `draft`（已填内容，可改一改重新提交），
        并回显 `auditRemark` 说明驳回原因。

        出参一律不返回身份证号明文，只给 `maskedIdCard`。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpertApplyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/expert/dashboard:
    get:
      tags: [expert]
      summary: 专家工作台
      description: |
        只要求专家角色，**不要求审核通过**——正在审核中或被驳回的用户
        也要能看到状态横幅，否则他们会以为提交失败了。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
