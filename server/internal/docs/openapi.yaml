openapi: 3.0.3
info:
  title: 运维专家服务平台 API
  version: 0.4.0
  description: |
    MVP（P0）阶段后端接口。当前已完成：健康检查、认证闭环（短信 / 微信登录、双令牌、登出）、个人资料、
    专家域（申请 / 审核 / 工作台 / 服务管理 / 钱包提现）、文件上传、知识库五个栏目，
    以及**悬赏问题与订单闭环**（发布悬赏 → 抢单 → 支付 → 履约 → 确认 → 结算 → 评价 / 争议）。

    | 栏目 | slug | 内容模型 | 说明 |
    | --- | --- | --- | --- |
    | Linux 实战教程 | `linux-tutorial` | article | 与运维资讯共用文章表，用 `channel` 字段区分 |
    | 运维题库 | `ops-quiz` | quiz | 单选 / 多选 / 判断，可在线作答并判分 |
    | 运维资讯 | `ops-news` | article | 本期为后台人工录入，不含自动聚合 |
    | 开源工具推荐 | `open-source-tools` | tool | 按语言 / 协议 / 部署方式筛选 |
    | 资源下载 | `resources` | resource | 文件私有存储，走签名 URL 下发 |

    栏目是代码内的注册表而非数据库表——栏目的增减属于产品结构变更，应当跟随代码发布；
    分类、标签这类运营常调的维度才落库。

    **订单状态机**（唯一权威在 `model/order.go`，后台强制流转同样受它约束）：

    ```
    pending_accept ──▶ pending_pay ──▶ in_service ──▶ pending_confirm ──▶ completed ──▶ settled
          │                │               │                │                 │
          └──▶ cancelled ◀─┘               └──▶ disputed ◀──┘                 └──▶ disputed
                                                 │
                                    ┌────────────┼────────────┐
                                    ▼            ▼            ▼
                                 refunded     completed    in_service
    ```

    两条刻意收紧的地方：`disputed` **不能**直接跳到 `settled`（必须先落 `completed`，
    否则订单没有 `confirmedAt`、评价入口也随之消失）；`cancelled` 只允许未支付之前的状态到达
    （已收款订单退出必须走争议 / 退款，否则退款额、平台佣金、专家实收三笔账无处落）。

    统一约定：
    - 所有业务响应体为 `{ code, message, data, requestId }`，`code=0` 表示成功。
    - 失败响应同时使用语义化的 HTTP 状态码（400 参数、401 未登录、403 无权限、409 冲突、429 限流、501 通道未开通）。
    - 分页响应 `data` 为 `{ list, total, page, pageSize }`。
    - 所有金额字段以「分」为单位的整数传输，字段名以 `Cents` 结尾；抽佣比例用**基点**（`commissionRateBp`，1500 表示 15%）。
    - **不返回状态中文标签**。所有 `status` 都是机器值，中文文案与按钮显隐由前端决定，
      后端再输出一份标签就等于有两个真相来源。
    - 订单号形如 `OE20261015212022658881`（`OE` + 14 位时间 + 6 位随机数字），
      路径参数统一叫 `orderNo`；形状不合法的入参直接 400，不会走到查库那一步。
    - 需要登录的接口使用 `Authorization: Bearer <accessToken>`。

servers:
  - url: http://localhost:8080
    description: 本地开发

tags:
  - name: health
    description: 健康检查
  - name: auth
    description: 认证与令牌
  - name: user
    description: 用户资料
  - name: kb
    description: 知识库（游客可读）
  - name: tool
    description: 开源工具推荐（游客可读）
  - name: resource
    description: 资源下载（游客可读，部分资源需登录）
  - name: quiz
    description: 运维题库（浏览与抽题游客可读，作答需登录）
  - name: upload
    description: 文件上传与私有文件下载
  - name: expert
    description: 专家域（公开展示、入驻申请、专家自助管理）
  - name: question
    description: 悬赏问题（发布 / 我的悬赏 / 取消）
  - name: order
    description: 订单与接单大厅（抢单、支付、履约、评价、争议）
  - name: admin-order
    description: 订单与争议管理（需 admin 角色）
  - name: admin-kb
    description: 知识库内容管理（需 admin 角色）：分类、文章、工具、资源、题库
  - name: admin-expert
    description: 专家审核（需 admin 角色）
  - name: admin-news
    description: 运维资讯订阅源管理（需 admin 角色）：增删改、立即抓取
  - name: qa
    description: 问答广场（读接口游客可读，写接口需登录）
  - name: admin-qa
    description: 问答内容审核（需 admin 角色）：待审回答、审核、删帖、转教程

paths:
  /healthz:
    get:
      tags: [health]
      summary: 存活探针
      description: 只要进程能响应即返回 200，不检查任何依赖。用于容器 livenessProbe。
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  env: { type: string, example: dev }
                  time: { type: string, format: date-time }

  /readyz:
    get:
      tags: [health]
      summary: 就绪探针
      description: 检查数据库连通性，失败返回 503，避免流量打到不可用的实例上。
      responses:
        '200':
          description: 依赖就绪
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: up }
        '503':
          description: 依赖不可用

  /api/v1/auth/sms/send:
    post:
      tags: [auth]
      summary: 发送短信验证码
      description: |
        三重限流：同一手机号发送间隔（默认 60 秒）、每小时上限、每日上限。
        开发环境（`sms.expose_code=true`）会在 `devCode` 字段直接返回验证码，便于联调；生产环境该字段恒为空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSMSCodeReq'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SendSMSCodeResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/login/sms:
    post:
      tags: [auth]
      summary: 手机号验证码登录
      description: 账号不存在时自动注册；验证码为一次性，校验成功即作废。连续 5 次错误后该验证码直接失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginSMSReq'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/auth/wechat/url:
    get:
      tags: [auth]
      summary: 获取微信授权地址
      description: 返回授权跳转 URL 与 state；state 有效期 5 分钟，回调登录时必须带回。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WechatAuthURLResp' }

  /api/v1/auth/login/wechat:
    post:
      tags: [auth]
      summary: 微信授权登录
      description: |
        账号匹配优先级：
        1. openid 已绑定 → 直接登录；
        2. 同时携带 `phone` 与 `smsCode` → 绑定到该手机号账号（不存在则创建）；
        3. 否则以 openid 新建账号，手机号留空，可在个人中心补绑。

        开发环境（`wechat.mock=true`）下 `code` 可传 `mock:<openid>` 直接模拟登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginWechatReq'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResp' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新访问令牌
      description: 刷新令牌一次性使用，成功后旧的立即失效（防重放）。前端应在并发请求前做单飞（single-flight）控制。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshReq'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出
      description: 吊销当前访问令牌；若传入 `refreshToken` 则同时使其失效。请求体可为空。
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutReq'
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [user]
      summary: 获取当前用户资料
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [user]
      summary: 更新当前用户资料
      description: 局部更新，未传字段保持不变。昵称按字符数校验（2~20）。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ 知识库（前台） ============================

  /api/v1/kb/categories:
    get:
      tags: [kb]
      summary: 分类列表
      description: 只返回启用中的分类，文章数按「已发布」统计。前端导航与首页分类入口用它。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/CategoryItem' }

  /api/v1/kb/tags:
    get:
      tags: [kb]
      summary: 标签列表
      description: 聚合已发布文章的标签，按文章数倒序，最多返回 50 个。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/TagItem' }

  /api/v1/kb/search/suggest:
    get:
      tags: [kb]
      summary: 检索词解析与建议
      description: |
        把用户的输入（可以是完整问句，例如「磁盘满了怎么办」）翻译成实际参与检索的词，
        并附带热门关键词，供搜索框做输入建议、搜索页回显检索依据。

        `terms` 是识别出的有效概念（已去掉疑问词与语气词）；
        `expanded` 是展开同义词之后真正用于匹配的词，比 `terms` 多。
        两者不一致时前端应当把它展示出来——检索不准时这是用户唯一的线索。
      parameters:
        - { name: q, in: query, schema: { type: string }, example: 磁盘满了怎么办 }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SearchSuggest' }

  /api/v1/kb/articles:
    get:
      tags: [kb]
      summary: 文章列表
      description: |
        只返回已发布文章。过滤条件可叠加：栏目（教程 / 资讯）、分类（ID 或 slug）、
        关键词（标题/摘要/正文/标签）、标签（精确匹配）。
        排序支持 latest（默认，按发布时间）/ hot（按阅读数）/ like（按点赞数）。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: categorySlug, in: query, schema: { type: string, example: k8s } }
        - { name: channel, in: query, schema: { type: string, enum: [linux-tutorial, ops-news] }, description: 按栏目过滤，省略为不限 }
        - { name: keyword, in: query, schema: { type: string, example: 重启 } }
        - { name: tag, in: query, schema: { type: string, example: Kubernetes } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, hot, like], default: latest } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/ArticleListItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/kb/articles/{key}:
    get:
      tags: [kb]
      summary: 文章详情
      description: |
        `key` 可以传数字 ID 或 slug——前台 SEO 链路走 slug，前端拿到列表的 ID 也能直接拼详情页。

        响应中的 `liked` 反映当前登录用户的点赞状态；未携带令牌时恒为 `false`。
        每次访问会把阅读数加一（写失败不影响正文返回）。
        未发布（草稿 / 已下线）的文章对游客与普通用户一律返回 404，避免内容通过 ID 枚举泄露。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: k8s-pod-restart-troubleshooting }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArticleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/kb/articles/{key}/like:
    post:
      tags: [kb]
      summary: 点赞 / 取消点赞
      description: 幂等切换。同一用户重复调用是"取消"，不会重复累加计数；返回最新点赞态与点赞数，前端直接用于回显。
      security:
        - BearerAuth: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: k8s-pod-restart-troubleshooting }
      responses:
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LikeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ 知识库（后台） ============================

  /api/v1/admin/kb/categories:
    get:
      tags: [admin-kb]
      summary: 后台分类列表
      description: 返回全部分类（含停用），文章数按全部状态统计。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/CategoryItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-kb]
      summary: 新建分类
      description: 名称与 slug 均需唯一；slug 省略时由名称推导（保留汉字），推导不出时自动生成随机串。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreateReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CategoryItem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/categories/{id}:
    put:
      tags: [admin-kb]
      summary: 更新分类
      description: 局部更新，未传字段保持不变。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdateReq' }
      responses:
        '200':
          description: 更新成功
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-kb]
      summary: 删除分类
      description: 分类下仍有文章时拒绝删除（409），避免文章集体失去分类导致前台导航与 SEO 面包屑断裂。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/articles:
    get:
      tags: [admin-kb]
      summary: 后台文章列表
      description: 可查全部状态（草稿 / 已发布 / 已下线），按创建时间倒序。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, offline] } }
        - { name: channel, in: query, schema: { type: string, enum: [linux-tutorial, ops-news] }, description: 按栏目过滤，省略为不限 }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/AdminArticleItem' }
    post:
      tags: [admin-kb]
      summary: 新建文章
      description: |
        `status` 省略即存草稿；传 `published` 时要求正文非空。
        摘要省略时自动从正文截取（去 Markdown 标记，120 字符）。

        slug 的两条路径刻意区别对待：
        - **显式传入**：冲突返回 409，不做静默改写——静默改成 `-2` 会让作者以为指定地址生效了、其实没有。
        - **省略**：由标题推导，撞名时自动追加 `-2` / `-3`。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleCreateReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminArticleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/articles/{id}:
    get:
      tags: [admin-kb]
      summary: 后台文章详情
      description: 含正文与全部 SEO 字段，草稿与已下线内容同样可读，供编辑页回填。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminArticleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 更新文章
      description: 局部更新，未传字段保持不变。只改标题时不会被自己的 slug 判为冲突。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleUpdateReq' }
      responses:
        '200':
          description: 更新成功
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-kb]
      summary: 删除文章
      description: 软删除，可由运维在数据库中恢复。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/kb/articles/{id}/publish:
    post:
      tags: [admin-kb]
      summary: 发布文章
      description: 草稿 / 已下线 → 已发布。正文为空时拒绝发布；发布时会自动补齐缺失的 SEO 字段。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminArticleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/articles/{id}/offline:
    post:
      tags: [admin-kb]
      summary: 下线文章
      description: 仅已发布文章可下线，内容保留，可再次发布。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 下线成功
        '409': { $ref: '#/components/responses/Conflict' }

  # ============================ 栏目导航 ============================

  /api/v1/channels:
    get:
      tags: [kb]
      summary: 栏目导航
      description: |
        返回知识库的五个栏目及其已发布内容数，供导航栏渲染角标。

        `kind` 表明该栏目承载的内容模型，前端据此决定用文章列表、答题页还是资源列表渲染：

        - `article` → 走 `/kb/articles?channel=...`（教程、资讯）
        - `quiz`    → 走 `/quiz/*`
        - `tool`    → 走 `/tools`
        - `resource`→ 走 `/resources`

        `count` 是各表分别统计后拼出来的，不是单表 count。单个栏目统计失败会降级为 0，
        不会让整个导航接口失败——导航挂了整站就进不去了。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ChannelItem' }

  # ============================ 开源工具推荐 ============================

  /api/v1/tools:
    get:
      tags: [tool]
      summary: 工具列表
      description: |
        只返回已发布工具。过滤条件可叠加。

        `language` 与 `license` 为精确匹配，用于「只看 Go 写的、Apache 协议的」这类筛选；
        可选值从 `/tools/filters` 取，避免前端手写枚举漂移。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: categorySlug, in: query, schema: { type: string, example: monitoring } }
        - { name: keyword, in: query, schema: { type: string, example: prometheus } }
        - { name: language, in: query, schema: { type: string, example: Go } }
        - { name: license, in: query, schema: { type: string, example: Apache-2.0 } }
        - { name: tag, in: query, schema: { type: string, example: 监控 } }
        - { name: featuredOnly, in: query, schema: { type: boolean } }
        - { name: minStars, in: query, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, hot, stars, sort], default: latest } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/ToolItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/tools/filters:
    get:
      tags: [tool]
      summary: 工具筛选项
      description: |
        返回筛选器的可选值。`languages` 与 `licenses` 从已发布工具的真实数据里聚合，
        不用写死的枚举；`deployModes` 是后端白名单，取值固定。

        注意本路径是静态段，与 `/tools/{key}` 同层共存——静态优先匹配，
        传 `filters` 不会落到详情接口。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolFilters' }

  /api/v1/tools/{key}:
    get:
      tags: [tool]
      summary: 工具详情
      description: |
        `key` 可以传数字 ID 或 slug。每次访问把浏览数加一（写失败不影响正文返回）。
        未发布工具对游客与普通用户一律 404。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: prometheus }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ 资源下载 ============================

  /api/v1/resources:
    get:
      tags: [resource]
      summary: 资源列表
      description: |
        只返回已发布资源。

        列表项刻意不含 `fileKey` 与下载直链——把可下载地址放在一个会被大量缓存与转发的
        列表响应里，等于让签名失去意义；下载必须走 `/resources/{key}/download` 现场签发。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: categorySlug, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, example: nginx } }
        - { name: tag, in: query, schema: { type: string, example: 脚本 } }
        - { name: fileExt, in: query, schema: { type: string, example: sh } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, hot, download], default: latest } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/ResourceItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/resources/file-exts:
    get:
      tags: [resource]
      summary: 资源文件类型
      description: 从已发布资源里聚合出的文件扩展名列表，供前端渲染筛选器。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { type: string, example: sh }

  /api/v1/resources/{key}:
    get:
      tags: [resource]
      summary: 资源详情
      description: '`key` 可以传数字 ID 或 slug。响应含使用说明与实际文件元信息（大小、SHA256 校验和）。'
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: nginx-ops-scripts }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/resources/{key}/download:
    get:
      tags: [resource]
      summary: 获取下载地址
      description: |
        现场签发一个有时效的下载地址，同时把下载数加一。

        本接口挂在 OptionalAuth 上而不是强制登录：绝大多数资源不要求登录，
        强制登录会把「下载即用」这个最好的获客钩子掐掉。标了 `needLogin` 的资源
        由服务端单独拦截并返回 40031。

        `expireAt` 是签名的失效时间戳（秒），前端可用它做倒计时提示。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: nginx-ops-scripts }
      responses:
        '200':
          description: 签发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceDownload' }
        '400':
          description: 该资源需要登录后才能下载（业务码 40031）
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ 运维题库 ============================

  /api/v1/quiz/questions:
    get:
      tags: [quiz]
      summary: 题目列表
      description: |
        只返回已发布题目。出参**不含正确答案与解析**——列表页拿到答案就等于开卷考试，
        前端也可能因顺手渲染而把答案漏出去。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: categorySlug, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string, example: OOM } }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: type, in: query, schema: { type: string, enum: [single, multiple, judge] } }
        - { name: tag, in: query, schema: { type: string, example: Kubernetes } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, hot, hard], default: latest } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/QuizQuestionItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/quiz/practice:
    get:
      tags: [quiz]
      summary: 随机抽题
      description: |
        随机抽题组成一轮练习，供「开始刷题」按钮使用。抽题条件可叠加。

        抽题在 SQL 层完成（MySQL `RAND()` / SQLite `RANDOM()`），不是取回全表再在内存里洗牌。
        `count` 超出题库总量时按实际数量返回，不报错；一题都抽不到才返回 40022。
      parameters:
        - { name: count, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 50 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: type, in: query, schema: { type: string, enum: [single, multiple, judge] } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/QuizQuestionItem' }
        '400':
          description: 没有符合条件的题目（业务码 40022）

  /api/v1/quiz/questions/{id}/answer:
    post:
      tags: [quiz]
      summary: 单题作答
      description: |
        单题作答并即时判分。

        无论答对答错都返回 `correctOptions` 与 `analysis` —— 题库的核心价值是让人学会，
        答错时不给解析等于只告诉人「你错了」。

        判分规则：

        - 单选 / 判断：选项集合必须完全相等
        - 多选：**集合相等，不给部分分**。漏选意味着操作规程不完整，那不算答对

        `fresh` 标记这道题是否为首次作答；重复作答不重复累加题目统计数据，
        否则反复刷同一道题就能把正确率刷上去。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizAnswerReq' }
      responses:
        '200':
          description: 判分成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizAnswerResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/quiz/attempts:
    post:
      tags: [quiz]
      summary: 交卷判分
      description: |
        整卷提交，返回成绩单与逐题解析。成绩单与逐题流水在同一事务里落库，
        不会出现「历史里有一张没有明细的成绩单」。

        `score` 为百分制整数（四舍五入）。同一次提交内的重复题目会去重，只计一次。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizSubmitReq' }
      responses:
        '201':
          description: 提交成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizSubmitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [quiz]
      summary: 答题历史
      description: 返回最近的若干次整卷成绩，用于「我的练习记录」。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/QuizAttemptItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/quiz/stats:
    get:
      tags: [quiz]
      summary: 我的答题统计
      description: |
        个人答题总览，用于题库首页的「我的战绩」。

        注意 `totalAnswered` 是**去重后的作答题数**，不是作答次数——同一道题刷十遍
        只算一题，否则正确率会随刷题次数波动而不是随掌握程度变化。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/quiz/wrong-book:
    get:
      tags: [quiz]
      summary: 错题本
      description: |
        口径是「**最近一次作答仍然答错**」，而不是「曾经答错过」。

        实现上先用 `MAX(id)` 按题取最近一条流水，再筛出其中 `correct = false` 的——
        如果按「曾经答错」来算，改对之后错题本里还会一直挂着，复习清单就不再可信。

        条目自带选项与解析：错题本的作用是复习，点进去还要再跳一次详情就太重了。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/QuizWrongItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ 知识库后台：开源工具 ============================

  /api/v1/admin/kb/tools:
    get:
      tags: [admin-kb]
      summary: 后台工具列表
      description: 可查全部状态（draft / published / offline）。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, offline] } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/AdminToolItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-kb]
      summary: 新建工具
      description: |
        `repoUrl` 与 `homepageUrl` 只接受 `http://` 或 `https://`——挡掉 `javascript:`
        与 `data:` 这类存储型 XSS 载荷（业务码 40019）。

        `deployModes` 走白名单校验（业务码 40018），取值见 `/tools/filters`。
        `status` 传 `published` 即直接发布并记录发布时间；否则存为草稿。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolCreateReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminToolDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/tools/{id}:
