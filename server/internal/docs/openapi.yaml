  /api/v1/expert/wallet:
    get:
      tags: [expert]
      summary: 收入钱包
      description: 返回余额、冻结额、累计收入，以及最近的收入明细与提现记录。金额单位为分。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
