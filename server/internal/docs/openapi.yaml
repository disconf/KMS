                      data: { $ref: '#/components/schemas/ExpertWallet' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/expert/withdrawals:
    post:
      tags: [expert]
      summary: 申请提现
      description: '提现下限 1000 分（10 元）；低于下限或超出可提余额返回 3xxxx。'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalCreateReq' }
      responses:
        '201':
          description: 申请成功
          content:
            application/json:
              schema:
