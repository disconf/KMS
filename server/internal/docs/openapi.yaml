      tags: [expert]
      summary: 提现记录
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/WithdrawalItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================ 专家后台：审核 ============================

  /api/v1/admin/finance/reconciliation:
    get:
      tags: [admin-finance]
      summary: 财务对账报表
      description: |
        按日给出四个口径的流水。**四列各自按自己的事发时间归日，同一天本来就不该相等**：

        | 列 | 归日依据 | 含义 |
        | --- | --- | --- |
        | 收款 | `orders.paid_at` | 用户付钱的那天 |
        | 退款 | `orders.refunded_at` | 钱退出去的那天（不是下单日） |
        | 结算 | `settlements.settled_at` | 专家余额增加、平台确认佣金的那天 |
        | 打款 | `withdrawals.paid_at` | 钱真正离开平台的那天（不是申请日） |

        `netCashCents` = 收款 − 退款 − 提现实付，表示当天平台账户的净流入。
        收款里含着代管中的专家款，结算只是把它从代管挪进专家余额、不动现金，
        所以不存在"当日利润"这种字段。

        `owed` 与 `totals` 不受日期区间影响：前者是当前时点的欠付，后者是全时段累计。

        `checks` 是账面恒等式校验，`level=error` 表示钱动错了地方，`warn` 表示数据不全
        （例如历史退款没有退款时间，能进累计但进不了按日统计）。
      security:
        - BearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: 开始日期，缺省为 29 天前 }
        - { name: to, in: query, schema: { type: string, format: date }, description: 结束日期（含当天），缺省为今天 }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FinanceReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/finance/reconciliation/day/{date}:
    get:
      tags: [admin-finance]
      summary: 对账单日明细
      description: |
        当天收款的订单、当天结算的分账、当天打款的提现，三组分开返回。
        单组上限 500 条——一天超过这个量说明不是日常经营数据，该走导出。
      security:
        - BearerAuth: []
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FinanceDayDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/finance/reconciliation/export:
    get:
      tags: [admin-finance]
      summary: 导出对账 CSV
      description: |
        内容与报表页完全一致（同一个 service 方法，不另开查询），末尾附一行合计。

        文件带 UTF-8 BOM——没有它 Excel 打开中文表头就是乱码；金额以元为单位、两位小数，
        由整数除法生成，不经过浮点。CSV 里**不写校验结论**：这张表是给 Excel 算数的，
        表格下面多出自由文本会让行数不确定、求和范围跟着错位。
      security:
        - BearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV 文件
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="finance-reconciliation-YYYYMMDD_YYYYMMDD.csv"
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/admin/users:
    get:
      tags: [admin-user]
      summary: 后台用户列表
      description: |
        `keyword` 有两种解释：**11 位纯数字按手机号全等匹配**，其余按昵称 / 邮箱模糊匹配。
        手机号在列表里一律脱敏——能模糊搜号段，等于把「这个号段里有哪些人」开放出去。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: keyword, in: query, schema: { type: string }, description: 完整手机号（全等）或昵称 / 邮箱（模糊） }
        - { name: role, in: query, schema: { type: string, enum: [user, expert, admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/AdminUserItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{id}:
    get:
      tags: [admin-user]
      summary: 后台用户详情
      description: 账号 + 专家档案 + 订单聚合 + 该账号收到的后台操作记录（最近的在前）。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUserDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users/{id}/status:
    post:
      tags: [admin-user]
      summary: 封禁 / 解封账号
      description: |
        改的是 `users.status`，**立即生效**：认证中间件每个请求都按库复核身份，
        对方手里的令牌下一次请求就会被拒，不必等它过期。

        专家档案、订单、余额、提现记录一概不动——解封后原样恢复。

        三条硬规则：不能操作自己的账号；封禁必须写原因（落 `users.status_reason` 与审计日志）；
        至少保留一个可用管理员。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateStatusReq' }
      responses:
        '200':
          description: 操作完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [active, disabled] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/users/{id}/role:
    post:
      tags: [admin-user]
      summary: 修改用户角色
      description: |
        角色立即生效，不需要对方重新登录。

        改成 `expert` 要求该用户已有**审核通过**的专家档案，否则返回 30029——
        手工提角色会绕开入驻审核，等于给了一条直接进接单列表的捷径。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateRoleReq' }
      responses:
        '200':
          description: 修改完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          role: { type: string, enum: [user, expert, admin] }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/admin/settings:
    get:
      tags: [admin-setting]
      summary: 系统配置总览
      description: |
        目前只有抽佣比例一项。`rateBp` 是当前生效值（基点，1500 = 15%），
        `defaultRateBp` 是配置文件里的出厂值，`isOverride` 表示后台是否改过。

        抽佣在下单那一刻写进订单快照，之后改比例只影响新订单——已下单的不会被追溯改账。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSettingOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/settings/commission:
    put:
      tags: [admin-setting]
      summary: 修改平台抽佣比例
      description: |
        输入基点，范围 0-5000（0-50%）。改完立即对之后创建的订单生效。
        实际值没变化时不写库、不留审计，避免审计里堆满"点了但没变"的噪声。

        每次真实变更都写一条 `setting.commission` 审计，明细带 `from` / `to`——
        只记终值的话，出问题回看时不知道改之前是多少。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCommissionUpdateReq' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CommissionSettingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/skills:
    get:
      tags: [admin-setting]
      summary: 后台技能字典列表
      description: 全量返回（含停用），附 `expertCount`（被多少位专家档案引用）。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/AdminSkillItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-setting]
      summary: 新增技能
      description: 名称唯一（冲突返回 409）。类目是自由文本，不做白名单。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSkillCreateReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSkillItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/skills/{id}:
    put:
      tags: [admin-setting]
      summary: 更新技能
      description: 全字段可选，未传的字段不改。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSkillUpdateReq' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSkillItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-setting]
      summary: 删除技能
      description: |
        被专家档案引用时返回 409，提示改用停用。删除是物理删除：
        `skills.name` 上有唯一索引，软删的行会一直占着名字，同名重建会静默撞索引。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/experts:
    get:
      tags: [admin-expert]
      summary: 后台专家列表
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, suspended] } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/AdminExpertItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/experts/{id}:
    get:
      tags: [admin-expert]
      summary: 专家审核详情
      description: 含资质材料列表；证件类文件为私有场景，返回的是带签名的临时地址。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminExpertDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/experts/{id}/audit:
    post:
      tags: [admin-expert]
      summary: 审核专家
      description: |
        `approved` 为 true 即通过，false 为驳回；驳回时 `remark` 会回显给申请人。

        审核人 ID 只从当前令牌取，不接受请求体传入——否则可以伪造审核人。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpertAuditReq' }
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminExpertDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/questions:
    post:
      tags: [question]
      summary: 发布悬赏问题
      description: |
        发布悬赏的同时创建一笔 `pending_accept` 的订单，两者在同一个事务里落库。

        订单在**发布时**而不是被抢单时创建，是为了让 `pending_accept` 这个状态有落脚点：
        抢单的并发控制是一句 `UPDATE ... WHERE status='pending_accept' AND expert_id=0`，
        没有这一行订单就没有地方让数据库裁决先后。
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCreateReq' }
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuestionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [question]
      summary: 我发布的悬赏
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string }, description: 'open|matched|cancelled|expired' }
        - { in: query, name: sort, schema: { type: string }, description: 'latest|amount' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - type: object
                            properties:
                              page: { type: integer, example: 1 }
                              pageSize: { type: integer, example: 20 }
                              total: { type: integer, format: int64, example: 42 }
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/QuestionItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/questions/{id}:
    get:
      tags: [question]
      summary: 悬赏详情
      description: 只有发布者与管理员能查看。
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuestionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/questions/{id}/cancel:
    post:
      tags: [question]
      summary: 取消悬赏
      description: |
        同时把问题置为已取消、把订单置为已取消。**已支付的悬赏不能取消**——
        钱已经进来，退出只能走争议/退款，否则退款金额与平台佣金无处落账。
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCancelReq' }
      responses:
        '200': { description: 已取消 }
        '409':
          description: '订单已支付（50014）或问题已结束（50002），不能取消'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders:
    post:
      tags: [order]
      summary: 预约专家下单（booking 型）
      description: |
        **请求体里没有金额字段。** 金额由服务端按专家定价与时长算出，
        向上取整到分。接受前端传金额等于让用户自己定价。
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateReq' }
      responses:
        '201':
          description: 下单成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderItem' }
        '400':
          description: '不能给自己下单（50018）、专家未设价格、时长非法（50013）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
    get:
      tags: [order]
      summary: 订单列表
      description: |
        `side=user` 是我下的单，`side=expert` 是我接的单，两个视图共用一套订单表，
        差别只在筛选字段（`user_id` / `expert_id`）。未分配的单不会出现在 `side=expert` 里。
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: side, schema: { type: string, enum: [user, expert], default: user } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [question, booking] } }
        - { in: query, name: keyword, schema: { type: string }, description: 匹配订单号与标题 }
        - { in: query, name: sort, schema: { type: string, enum: [latest, oldest, amount] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - type: object
                            properties:
                              page: { type: integer, example: 1 }
                              pageSize: { type: integer, example: 20 }
                              total: { type: integer, format: int64, example: 42 }
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/OrderItem' }

  /api/v1/orders/counts:
    get:
      tags: [order]
      summary: 订单各状态数量
      description: 订单中心的 Tab 角标。`byStatus` 只包含有数据的状态，取不到的状态视为 0。
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: side, schema: { type: string, enum: [user, expert], default: user } }
      responses:
        '200':
          description: 数量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderCounts' }

  /api/v1/orders/pay-channels:
    get:
      tags: [order]
      summary: 可选支付通道
      description: |
        没有接通的通道也会返回，但 `available=false`——前端应置灰而不是隐藏，
        让用户知道"以后会有"，而不是以为平台本来就不支持。
        清单不写在前端：能不能用取决于后端装配了哪个 provider。
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 通道列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/PayChannelItem' }

  /api/v1/orders/hall:
    get:
      tags: [order]
      summary: 接单大厅
      description: |
        还没被接单的悬赏。**要求审核通过且开放接单的专家。**

        返回的是 `HallItem`：内容取自问题，但额外带上订单号——
        抢单接口用订单号标识，没有它前端拿到一条悬赏也无从下手。
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: skillId, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [latest, amount, expiring] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - type: object
                            properties:
                              page: { type: integer, example: 1 }
                              pageSize: { type: integer, example: 20 }
                              total: { type: integer, format: int64, example: 42 }
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/HallItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/orders/{orderNo}:
    get:
      tags: [order]
      summary: 订单详情
      description: 只有下单人与服务专家能查看。后台走 `/admin/orders/{orderNo}`。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/orders/{orderNo}/grab:
    post:
      tags: [order]
      summary: 专家抢单
      description: |
        抢单的并发裁决交给数据库：`UPDATE orders SET expert_id=? WHERE id=? AND status='pending_accept' AND expert_id=0`。
        先查后写一定会出现两个人都认为自己抢到的情况。

        抢到的同时开始支付倒计时（`payExpireAt`），并把问题置为 `matched`。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      responses:
        '200':
          description: 抢单成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetail' }
        '400':
          description: 不能接自己发布的问题（50008）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403':
          description: 不是已通过审核且开放接单的专家（50019）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '409':
          description: 已被别人接走（50011）或状态已变（50010）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/pay:
    post:
      tags: [order]
      summary: 发起支付
      description: |
        通道行为差异全部收在 provider 里：

        | 通道 | 行为 |
        | --- | --- |
        | `mock` | 立即成功，订单直接进"服务中"。仅开发环境 |
        | `offline` | 返回 `manual=true` 的转账指引，订单**留在待支付**等后台人工确认 |
        | `wechat` / `alipay` | 尚未接通，返回 501 |

        通道名不认识 → 400；认识但没接通 → 501。**不做静默降级**。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPayReq' }
      responses:
        '200':
          description: 支付发起结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderPayResult' }
        '409':
          description: '已支付（60004）或订单状态不支持支付（50010）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '501':
          description: 该通道尚未开通（60002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/cancel:
    post:
      tags: [order]
      summary: 取消订单
      description: 只有**未支付**的订单能取消。已支付后退出必须走争议/退款。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCancelReq' }
      responses:
        '200': { description: 已取消 }
        '409':
          description: 订单已进入服务流程（50014）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/sessions:
    post:
      tags: [order]
      summary: 开始服务会话
      description: |
        订单已有进行中的会话时**直接复用返回**，此时 `channel` 可以省略。
        复用必须先于通道校验：调用方隔了半小时再点进来，手里未必还留着上次的通道，
        而它真正想问的是"把那个还在进行的会话给我"。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
        - { in: query, name: channel, schema: { type: string, enum: [im, voice, video, screen] }, description: 已有会话时可省略 }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderSessionItem' }
        '409':
          description: 订单不在服务中（50010）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/sessions/end:
    post:
      tags: [order]
      summary: 结束当前会话
      description: 时长由服务端按开始时间算，不接受客户端传入。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      responses:
        '200':
          description: 会话（含 durationSec）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderSessionItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{orderNo}/finish:
    post:
      tags: [order]
      summary: 专家标记服务完成
      description: |
        转入"待确认"并同时落 `confirmDeadline`（自动确认截止时间）。
        若还有进行中的会话，一并结束——专家忘了点结束会话时，
        那条会话会一直挂着继续计时，订单时长就没有底了。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      responses:
        '200': { description: 已完成标记 }
        '403':
          description: 只有该订单的服务专家能操作（50017）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/confirm:
    post:
      tags: [order]
      summary: 确认完成（随后自动结算）
      description: |
        只有下单人能确认。确认即结算——确认完成本来就是用户对"服务已交付"的表态，
        再让用户点一次"确认结算"没有意义。

        与定时任务的自动确认共用同一段实现，避免两条路径落下不同的时间戳
        （有的订单有 `confirmedAt`、有的没有，履约统计口径就分叉了）。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      responses:
        '200': { description: 已确认并结算 }
        '409':
          description: 订单不在待确认状态（50010）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/review:
    post:
      tags: [order]
      summary: 提交评价
      description: |
        只有下单人能评，一单一评。已完成与已结算都可评价——
        结算紧跟在完成之后，若只允许 `completed`，用户点完确认的下一秒去评价
        会发现按钮是灰的。

        **一单一评由 `reviews.order_id` 唯一索引守**，并发双击也只有一条能落库。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReviewReq' }
      responses:
        '201':
          description: 评价已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderReviewItem' }
        '409':
          description: '订单未完成（50020）或已评价过（50021）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/orders/{orderNo}/review/reply:
    post:
      tags: [order]
      summary: 专家回复评价
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReviewReplyReq' }
      responses:
        '200': { description: 已回复 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/orders/{orderNo}/review/appeal:
    post:
      tags: [order]
      summary: 专家申诉评价
      description: |
        申诉**不改变评分**。评分是评价人的表达，不能被被评价方改写；
        只是给评论区挂一个"已申诉"标记，等后台人工复核。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReviewAppealReq' }
      responses:
        '200': { description: 已申诉 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/orders/{orderNo}/dispute:
    post:
      tags: [order]
      summary: 发起争议
      description: 下单人与服务专家都能发起。同一订单不允许同时存在两条未结案争议。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderDisputeReq' }
      responses:
        '201':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDisputeItem' }
        '409':
          description: '已在争议处理中（50025）或订单状态不支持发起争议（50010）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/admin/orders:
    get:
      tags: [admin-order]
      summary: 后台订单列表
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [question, booking] } }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: expertId, schema: { type: integer, format: int64 } }
        - { in: query, name: userId, schema: { type: integer, format: int64 } }
        - { in: query, name: createdFrom, schema: { type: string, format: date-time } }
        - { in: query, name: createdTo, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - type: object
                            properties:
                              page: { type: integer, example: 1 }
                              pageSize: { type: integer, example: 20 }
                              total: { type: integer, format: int64, example: 42 }
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/OrderItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/orders/{orderNo}:
    get:
      tags: [admin-order]
      summary: 后台订单详情
      description: 后台不受"只有订单双方能看"的限制。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetail' }

  /api/v1/admin/orders/{orderNo}/mark-paid:
    post:
      tags: [admin-order]
      summary: 人工确认收款
      description: 供 `offline` 通道使用。这是"订单收到钱"的入口之一，与在线支付走同一段实现。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrderMarkPaidReq' }
      responses:
        '200': { description: 已确认收款 }
        '409':
          description: 订单状态不支持标记已支付（50010）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/admin/orders/{orderNo}/transition:
    post:
      tags: [admin-order]
      summary: 强制流转订单状态
      description: |
        **仍然受状态机约束。** 后台需要的是"处理完争议后把订单推进到下一状态"，
        而不是"随便改成已完成"——放开状态机等于把订单数据变成可以手改的文本，
        之后所有基于状态的统计都不再可信。

        `to=settled` 会走结算流程（写分账记录、给专家余额到账），不是直接改字段。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrderTransitionReq' }
      responses:
        '200': { description: 已流转 }
        '409':
          description: 状态机不允许这一步（50010）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/admin/orders/{orderNo}/settle:
    post:
      tags: [admin-order]
      summary: 手动触发结算
      description: 只接受"已完成"的订单。金额以订单上的快照为准，不用当前抽佣配置重算。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string, example: OE20261015212022658881 }, description: 订单号（OE + 14 位时间 + 6 位随机数字） }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettleReq' }
      responses:
        '200': { description: 已结算 }
        '409':
          description: '订单未完成（60006）或已结算（60008）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/admin/disputes/{id}/resolve:
    post:
      tags: [admin-order]
      summary: 处理争议
      description: |
        三种结论，直接以订单状态收口（不再套一层 approve/reject 词表）：

        | resolution | 订单落点 |
        | --- | --- |
        | `refunded` | 退款，记录 `refundCents` |
        | `completed` | 判定服务已交付，随后自动结算 |
        | `in_service` | 驳回争议，恢复服务中 |
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 }, description: 争议 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminResolveDisputeReq' }
      responses:
        '200': { description: 已处理 }
        '409':
          description: '争议已结案（60010）或订单状态不支持该结论（50010）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  # ==================== 题库方向（第五·补阶段） ====================

  /api/v1/quiz/categories:
    get:
      tags: [quiz]
      summary: 题库方向列表（按方向刷题）
      description: |
        返回**全部启用的分类**，包含题量为 0 的方向——前端据此显示「筹备中」并置灰，
        而不是让一个方向凭空消失。带上登录态时额外返回该用户在每个方向的已答 / 答对数。

        为什么单独开一个接口而不是复用 `/kb/categories`：那个接口的 count 是文章数，
        与题目数完全无关；混用会让"这个方向有 12 道题"显示成"有 12 篇文章"。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/QuizCategoryItem' }

  # ======================== 投稿与审核（第七阶段） ========================

  /api/v1/quiz/contribute:
    post:
      tags: [quiz]
      summary: 投稿一道题
      description: |
        落库固定 pending。请求体里没有 status 字段——让客户端传状态
        等于把发布权限交给浏览器。解析必填，没有解析的题答错的人不知道错在哪。
        有直发权限的账号（认证专家/管理员）会被服务端直接发布并计贡献分。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizContributeReq' }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizContributeResp' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/quiz/my/contributions:
    get:
      tags: [quiz]
      summary: 我投的题
      description: |
        放在 /quiz 下而不是 /me 下：文章投稿的「我的投稿」挂在 /me/contributions，
        两条路径不共用前缀，避免个人入口被 /kb 组的前缀吞掉。
        返回结构与文章投稿的列表一致（MyContributionItem），前端一页两个 tab 共用一份卡片模板。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/MyContributionItem' }

  /api/v1/tool-books/{id}:
    get:
      tags: [kb-tool]
      summary: 教程集详情
      description: |
        工具详情页已经把该工具下所有已发布教程集的目录树一并带回来了
        （ToolDetail.books），这里只服务「独立打开一本教程集」的场景——
        从收藏夹、分享链接直接进来。草稿与已下线的书返回 404，不透露存在性。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolBookDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/kb/articles/contribute:
    post:
      tags: [kb]
      summary: 用户投稿
      description: |
        任何登录用户都可以提交内容，但落库状态**固定为 `pending`**，请求体里没有 status 字段。
        是否上线由运营在后台审核决定——让客户端传状态等于把发布权限交给浏览器。

        投稿只接受图文教程类栏目。运维资讯由订阅源抓取 + 运营挑选，
        开放投稿等于任何人都能往「行业动态」里塞软文，且无法与抓取内容区分（业务码 40001）。

        slug 由标题推导，冲突时自动追加 `-2`/`-3`；不接受调用方指定 slug。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleContributeReq' }
      responses:
        '201':
          description: 已提交，等待审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminArticleDetail' }
        '400':
          description: '参数不合法（10001）或向运维资讯投稿（10001）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/contributions:
    get:
      tags: [kb]
      summary: 我的投稿
      description: |
        返回该用户提交过的全部内容（含草稿以外的各状态），按提交时间倒序。

        必须带 `status` 与 `reviewNote`：被驳回之后作者要知道改什么，
        只显示「已驳回」等于让人对着一个不存在的错误反复试。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/MyContributionItem' }
                          total: { type: integer, format: int64 }
                          page: { type: integer }
                          pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/kb/articles/{id}/review:
    post:
      tags: [admin-kb]
      summary: 审核投稿
      description: |
        `approve` 通过并把状态置为 published、写入发布时间；`reject` 驳回并**必须**填写原因（业务码 10001）。

        只接受 `pending` 状态的内容，且服务端用条件更新（`WHERE status='pending'`）：
        两个管理员同时点「通过」时第二次命中 0 行并返回错误，而不是把发布时间再刷一遍。
        当前状态不是待审核时，错误信息里带中文状态名（如「已驳回」）。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleReviewReq' }
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminArticleDetail' }
        '400':
          description: '驳回未填原因、动作非法、或内容已不在待审状态（10001）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 工具四类教程 / 资源外链（后台） ====================

  /api/v1/admin/kb/tools/{id}/guides:
    get:
      tags: [admin-kb]
      summary: 读取工具的四类实战教程
      description: |
        后台读取**不过滤**已下线文章的关联：运营需要看到"这条挂的文章现在打不开"，
        否则只能靠猜为什么前台少了一条。前台接口会自动跳过这类死链。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ToolGuideItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 整体替换工具的四类实战教程
      description: |
        整体替换而非逐条增删：这张表是工具的「配置」，前端一次性提交完整清单最简单，
        也不会出现"删了一半、另一半还挂着"的中间态。服务端在同一个事务里先删后插。

        每条必须属于 deploy / implement / optimize / cluster 之一（binding 校验）；
        关联站内文章时只接受**已发布**的文章，外链走 http/https 白名单。
        每个工具最多 24 条。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolGuidesReq' }
      responses:
        '200':
          description: 保存成功，返回保存后的清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ToolGuideItem' }
        '400':
          description: 'kind 取值非法、文章未发布、外链不是 http/https、超过 24 条（10001）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/kb/resources/{id}/links:
    get:
      tags: [admin-kb]
      summary: 读取资源的外部下载地址
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ResourceLinkItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 整体替换资源的外部下载地址
      description: |
        安装包动辄上百 MB、版本更新频繁，平台自己托管不划算也容易过期。
        这类资源只给「去哪下」：官网、国内镜像、包管理器、代码仓库、容器镜像。

        kind 不认识的取值会被归一为 `other` 而**不报错**——运营复制粘贴时多带个空格
        不该让整份清单存不下去。每个资源最多 8 条。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceLinksReq' }
      responses:
        '200':
          description: 保存成功，返回保存后的清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ResourceLinkItem' }
        '400':
          description: '链接不是 http/https 或超过 8 条（10001）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ======================== 运维资讯订阅源（后台） ========================

  /api/v1/admin/news/sources:
    get:
      tags: [admin-news]
      summary: 订阅源列表
      description: 含每个源的上次抓取时间、上次状态与错误原因——运营据此判断"是这个源挂了还是网络不通"。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/NewsSourceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-news]
      summary: 新增订阅源
      description: |
        `kind` 决定解析方式：`rss`（RSS 2.0 / Atom 同一套解析）或 `github`
        （`url` 写仓库路径 `owner/repo`，走 GitHub Releases API）。

        `autoPublish` 默认 **false**：抓回来的内容先进待采用池（pending），
        由运营挑选。聚合站的内容尤其不能自动上线——那等于把别人的选题与观点
        直接挂上平台首页。官方源可以开，但默认仍不开。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsSourceReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NewsSourceItem' }
        '400':
          description: '名称重复或参数非法（10001）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/news/sources/{id}:
    put:
      tags: [admin-news]
      summary: 更新订阅源
      description: 未传字段保持不变（局部更新）。停用后调度任务不再抓取，但已抓到的内容不受影响。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsSourceUpdateReq' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NewsSourceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-news]
      summary: 删除订阅源
      description: 只删订阅关系，已抓取的文章保留。删掉的文章会让历史链接 404，那是更大的损失。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/news/sources/{id}/fetch:
    post:
      tags: [admin-news]
      summary: 立即抓取一个订阅源
      description: |
        手动触发，绕过 20 分钟的自动节流——**运营刚加完源要立刻验证它能不能用**，
        等 20 分钟不合理。返回本次写入几条，以及失败原因。

        去重靠 `articles.external_id` 唯一索引：同一篇公告被反复抓到时
        写入结果是 `written=false` 而不是报错。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 抓取完成（可能 0 条）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FetchResultItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/qa/questions:
    get:
      tags: [qa]
      summary: 问答列表
      description: |
        读接口允许游客访问（OptionalAuth）：问答是最典型的搜索引擎落地页场景，
        拦在登录后面等于放弃这块流量。**第一页**请求会额外返回 `stats`
        （全局统计：待解答 / 已解决 / 已发布回答数），翻页不带。

        回答数只统计**已发布**回答，待审回答不计入；`hasAccepted` 是显式布尔，
        前端别拿 `status != open` 猜「已解决」——关帖也是非 open 但并未解决。

        排序按 `last_answer_at` 倒序、为空退回 `created_at`：新回答会把帖子顶上来，
        这比"按发布时间"更贴合问答的使用节奏。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, closed] }, description: 省略为不限 }
        - { name: skillId, in: query, schema: { type: integer, format: int64 }, description: 按技术标签过滤 }
        - { name: unanswered, in: query, schema: { type: boolean }, description: 只看零回答（「待解答」标签页用它） }
        - { name: keyword, in: query, schema: { type: string, example: 磁盘满了 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QaListPage' }
    post:
      tags: [qa]
      summary: 发布问题
      description: |
        同一账号 10 分钟内只能发一条（冷却，非滑动窗口）。这类内容不是钱，
        挡住"一分钟发十条"就够，再严会误伤连着问两个问题的人。

        请求体里**没有** `status`、`userId`：让客户端传这两个值等于同时打开
        「冒充别人提问」与「自己决定是否上线」两个后门。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaAskReq' }
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QaQuestionItem' }
        '400':
          description: '标题不足 6 字（45009）、正文不足 10 字（45010）、冷却中或附件非法（10001）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/qa/questions/{id}:
    get:
      tags: [qa]
      summary: 问答详情
      description: |
        回答列表的可见性分三档：管理员看全部；登录用户看"已发布 + 自己那条"；
        游客只看已发布。作者因此能看到自己还在审核中的回答，并带 `status=pending`。

        `canAccept` / `canClose` / `myAnswerId` 由服务端判定后下发，
        前端只用来决定按钮显隐——前端算出来的只能表示"看起来能不能点"。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QaQuestionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [qa]
      summary: 删除自己的提问
      description: 只能删自己的（管理员走后台接口）。软删除，回答一并不可见。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '403':
          description: '不是提问人（45005）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/qa/questions/{id}/answers:
    post:
      tags: [qa]
      summary: 回答问题
      description: |
        **一人一答**（`(question_id, user_id)` 联合唯一索引）：想补充只能编辑原回答，
        再发一条会拿到 45004。这样回答列表不会被同一个人的多条答复刷屏。

        审核分层：管理员与**已过审专家**免审直发（`status=published`）；
        其余账号前 3 条回答先进 `pending`。判定要求 `role=expert` 且
        `expertStatus=approved`——只设角色不给档案的历史脏值不算专家。

        不能回答自己的提问（45003），已关闭/已解决的问题不能再答（45002）。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaAnswerReq' }
      responses:
        '200':
          description: 发布成功（注意 `status` 可能是 pending）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QaAnswerItem' }
        '400':
          description: '内容不足 10 字（45010）或回答了同一个问题（45004）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '不能回答自己的提问（45003）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '问题已关闭或已解决（45002）、已回答过（45004）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/qa/questions/{id}/accept/{answerId}:
    post:
      tags: [qa]
      summary: 采纳回答
      description: |
        只有提问人能采纳，且只能采纳**已发布**的回答。采纳即把问题置为 resolved，
        并给回答作者 +10 积分（`point_logs` 上 `uniq_key` 唯一索引兜底，不会重复记）。

        状态流转走 CAS：一条 `UPDATE ... WHERE id=? AND user_id=? AND status='open'`
        同时完成身份校验、状态校验与写入。拆成"先查再改"会让两个人各拿一次积分。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: answerId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 采纳成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accepted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '不是提问人（45005）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '404':
          description: '问题（45001）或回答（45007）不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '409':
          description: '已回答过（45006）、回答未过审（45008）、问题已关闭（45002）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/qa/questions/{id}/close:
    post:
      tags: [qa]
      summary: 关闭问题
      description: 提问人自己收帖（比如问题已自行解决，或不想再收回答）。已采纳的问题不能再关。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 关闭成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          closed: { type: boolean }
        '403':
          description: '不是提问人（45005）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '已处理过（45006）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/qa/answers/{id}:
    put:
      tags: [qa]
      summary: 编辑自己的回答
      description: |
        一人一答的补充通道。编辑不会重置审核状态：已发布的改动立即生效，
        待审的仍是待审——否则"先发合规内容过审、再改成广告"就成了后门。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaAnswerReq' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '不是回答作者（45005）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [qa]
      summary: 删除自己的回答
      description: 仅作者可删。已采纳的回答会被解除采纳标记，问题退回 open。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '403':
          description: '不是回答作者（45005）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/qa/answers/{id}/like:
    post:
      tags: [qa]
      summary: 点赞回答
      description: |
        幂等：重复点只算一次（`qa_answer_likes` 上 `(answer_id, user_id)` 唯一索引）。
        积分记在**回答作者**头上（+1），点赞人不得分；自己给自己点赞计数照加、积分不加。

        `uniq_key = qa.like:{answerId}:{userId}` 保证"取消再点"也不重复记分——
        应用层先查在并发下会漏，真正兜底的是索引。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 点赞成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          liked: { type: boolean, example: true }
                          score: { type: integer, format: int64, description: 最新点赞数 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [qa]
      summary: 取消点赞
      description: 物理删除点赞行（不软删——软删的行仍占唯一索引，再点会静默失败）。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          liked: { type: boolean, example: false }
                          score: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/qa/my/points:
    get:
      tags: [qa]
      summary: 我的贡献积分
      description: |
        积分只做展示（徽章 / 等级），**不兑换任何权益**，因此不进订单与结算链路。

        计分规则：采纳回答 +10、回答被赞 +1（自赞不算）、投稿过审 +20、题目过审 +5。
        徽章阈值 0 / 10 / 50 / 200（新手 / 活跃 / 贡献者 / 资深贡献者）。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyPointsResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/qa/answers/pending:
    get:
      tags: [admin-qa]
      summary: 待审回答列表
      description: 附带所属问题标题——审核一条回答必须能看到它在回答什么问题，否则没法判断是否答非所问。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QaAdminList' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/qa/answers/{id}/review:
    post:
      tags: [admin-qa]
      summary: 审核回答
      description: |
        审核走 CAS（`WHERE id=? AND status='pending'`）：两人同时点通过，
        第二次命中 0 行并报错，而不是把同一条回答过两遍、发两次通知。
        驳回**必须填原因**，原因只下发给作者本人。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaReviewReq' }
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reviewed: { type: boolean }
        '400':
          description: 'action 非 approve/reject（10001）、驳回未填原因'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '该回答已被处理（45006）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }

  /api/v1/admin/qa/questions/{id}:
    delete:
      tags: [admin-qa]
      summary: 后台删除问题
      description: |
        用于处理违规内容。内部把访问者角色强制置为 admin，复用前台同一套权限判断，
        避免"后台一套、前台一套"两处口径不一致。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/qa/questions/{id}/to-article:
    post:
      tags: [admin-qa]
      summary: 问答转教程草稿
      description: |
        把「问题 + 采纳回答」拼成一篇**草稿**落进知识库，供运营二次加工。

        刻意只生成 draft、不给"直接发布"：问答原文是一问一答的碎片，
        直接发出去读者看到的不是教程。转换本身会记一条审计（`qa.to_article`）。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaToArticleReq' }
      responses:
        '200':
          description: 转换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QaToArticleResp' }
        '400':
          description: '栏目非法或未采纳任何回答'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Body' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Body' }
    Unauthorized:
      description: 未登录或令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Body' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Body' }
    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Body' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Body' }
    Conflict:
      description: 状态冲突（唯一性占用、状态流转非法、分类下仍有文章等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Body' }

  schemas:
    Body:
      type: object
      description: 统一响应体
      properties:
        code:
          type: integer
          description: 业务码，0 表示成功
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
        requestId:
          type: string
          description: 请求链路 ID，排障时提供给服务端
          example: 3f1c2a9e-6b0d-4d1a-9f1e-2c7b5a8d4e10

    PageData:
      type: object
      properties:
        list: { type: array, items: {} }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    SendSMSCodeReq:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: '13800000000'
        scene:
          type: string
          enum: [login, bind]
          default: login

    SendSMSCodeResp:
      type: object
      properties:
        expiresIn:
          type: integer
          description: 验证码有效期（秒）
          example: 300
        interval:
          type: integer
          description: 下次可发送的间隔（秒）
          example: 60
        devCode:
          type: string
          description: 仅开发环境返回，生产环境恒为空
          example: '123456'

    LoginSMSReq:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string, example: '13800000000' }
        code: { type: string, example: '123456' }
        nickname:
          type: string
          description: 仅首次注册时生效
          example: 老王

    WechatAuthURLResp:
      type: object
      properties:
        url: { type: string }
        state: { type: string, description: 有效期 5 分钟 }

    LoginWechatReq:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 微信授权 code；mock 模式下传 mock:<openid>
          example: mock:mock_openid_demo
        state: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        phone:
          type: string
          description: 选填，用于把微信绑定到手机号账号
        smsCode:
          type: string
          description: scene=bind 的验证码

    RefreshReq:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutReq:
      type: object
      properties:
        refreshToken: { type: string }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: 访问令牌有效期（秒） }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, description: 刷新令牌有效期（秒） }

    AuthResp:
      type: object
      properties:
        token: { $ref: '#/components/schemas/TokenPair' }
        user: { $ref: '#/components/schemas/UserProfile' }
        isNewUser: { type: boolean, description: 本次是否为新注册 }

    UserProfile:
      type: object
      description: 手机号已脱敏；openid / 身份证号等敏感字段不返回
      properties:
        id: { type: integer, format: int64 }
        phone: { type: string, example: '138****0000' }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [user, expert, admin]
        expertStatus:
          type: string
          description: 仅 role=expert 时返回
          enum: [pending, approved, rejected, suspended]
        createdAt: { type: string, format: date-time }

    UpdateProfileReq:
      type: object
      description: 传入哪个字段就更新哪个，未传的保持不变
      properties:
        nickname: { type: string, minLength: 2, maxLength: 20 }
        avatar: { type: string, maxLength: 512 }
        email: { type: string, maxLength: 128 }

    # ============================ 知识库 ============================

    CategoryItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: K8s 与云原生 }
        slug: { type: string, example: k8s }
        icon: { type: string, description: 分类图标地址 }
        sort: { type: integer, description: 排序权重，越小越靠前 }
        articleCount: { type: integer, format: int64, description: 前台只统计已发布 }
        enabled: { type: boolean }

    SearchSuggest:
      type: object
      properties:
        query:
          type: string
          description: 原样返回的用户输入，便于前端回显
        terms:
          type: array
          description: 识别出的有效概念（已剔除疑问词、语气词与单字噪声）
          items: { type: string }
        expanded:
          type: array
          description: 展开同义词后实际参与匹配的词，包含 terms
          items: { type: string }
        hot:
          type: array
          description: 热门关键词，取自标签聚合，最多 8 个
          items: { type: string }

    TagItem:
      type: object
      properties:
        name: { type: string, example: Kubernetes }
        count: { type: integer, format: int64, example: 12 }

    SEOInfo:
      type: object
      description: SEO 结构化字段；缺省项由标题 / 摘要 / 标签自动兜底，保证前台总有完整数据
      properties:
        title: { type: string }
        description: { type: string }
        keywords: { type: string, description: 逗号分隔 }

    ArticleListItem:
      type: object
      description: 列表卡片字段，不含正文
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        cover: { type: string }
        channel:
          type: string
          description: 所属栏目。教程与资讯共用文章表，靠本字段区分。
          enum: [linux-tutorial, ops-news]
          default: linux-tutorial
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        categorySlug: { type: string }
        tags: { type: array, items: { type: string } }
        authorName: { type: string }
        viewCount: { type: integer, format: int64 }
        likeCount: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time, nullable: true, description: 草稿为 null }

    ArticleDetail:
      allOf:
        - $ref: '#/components/schemas/ArticleListItem'
        - type: object
          properties:
            content: { type: string, description: Markdown 正文 }
            seo: { $ref: '#/components/schemas/SEOInfo' }
            source: { type: string, enum: [manual, order], description: manual 人工撰写 / order 订单案例沉淀 }
            liked: { type: boolean, description: 当前登录用户是否已点赞；未登录恒为 false }
            related:
              type: array
              description: 同分类相关文章，最多 5 篇
              items: { $ref: '#/components/schemas/ArticleListItem' }

    LikeResult:
      type: object
      properties:
        liked: { type: boolean, description: true 表示本次操作后处于已点赞态 }
        likeCount: { type: integer, format: int64, description: 最新点赞总数 }

    AdminArticleItem:
      allOf:
        - $ref: '#/components/schemas/ArticleListItem'
        - type: object
          properties:
            status: { type: string, enum: [draft, published, offline] }
            authorId: { type: integer, format: int64 }

    AdminArticleDetail:
      allOf:
        - $ref: '#/components/schemas/AdminArticleItem'
        - type: object
          properties:
            content: { type: string }
            seo: { $ref: '#/components/schemas/SEOInfo' }
            source: { type: string }

    ArticleCreateReq:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, description: 省略时由标题推导，重名自动避让, maxLength: 200 }
        summary: { type: string, description: 省略时自动从正文截取, maxLength: 500 }
        cover: { type: string, maxLength: 512 }
        content: { type: string, description: Markdown 正文, maxLength: 100000 }
        channel:
          type: string
          description: 所属栏目，省略按 linux-tutorial 处理；只接受文章型栏目
          enum: [linux-tutorial, ops-news]
        categoryId: { type: integer, format: int64 }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 32 } }
        seoTitle: { type: string, maxLength: 200 }
        seoDescription: { type: string, maxLength: 500 }
        seoKeywords: { type: string, maxLength: 500 }
        status:
          type: string
          enum: [draft, published]
          default: draft
          description: 省略即存草稿；传 published 时正文不能为空

    ArticleUpdateReq:
      type: object
      description: 传入哪个字段就更新哪个，未传的保持不变；不支持改状态，状态由发布 / 下线接口流转
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        cover: { type: string, maxLength: 512 }
        content: { type: string, maxLength: 100000 }
        channel: { type: string, enum: [linux-tutorial, ops-news] }
        categoryId: { type: integer, format: int64 }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 32 } }
        seoTitle: { type: string, maxLength: 200 }
        seoDescription: { type: string, maxLength: 500 }
        seoKeywords: { type: string, maxLength: 500 }

    CategoryCreateReq:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64, example: 可观测性 }
        slug: { type: string, description: 省略时由名称推导, maxLength: 64 }
        icon: { type: string, maxLength: 255 }
        sort: { type: integer, default: 0 }
        enabled: { type: boolean, default: true }

    CategoryUpdateReq:
      type: object
      description: 传入哪个字段就更新哪个，未传的保持不变
      properties:
        name: { type: string, maxLength: 64 }
        slug: { type: string, maxLength: 64 }
        icon: { type: string, maxLength: 255 }
        sort: { type: integer }
        enabled: { type: boolean }

    # ======================== 栏目导航 ========================

    ChannelItem:
      type: object
      description: 栏目导航项
      properties:
        slug: { type: string, example: linux-tutorial }
        name: { type: string, example: Linux 实战教程 }
        icon: { type: string, example: terminal }
        desc: { type: string, example: 从命令行到内核，边做边学 }
        kind:
          type: string
          description: 内容模型，前端据此选择渲染方式
          enum: [article, tool, quiz, resource]
        sort: { type: integer, description: 导航排序权重, example: 10 }
        path: { type: string, description: 前端路由路径, example: /kb/linux-tutorial }
        count: { type: integer, format: int64, description: 已发布内容数, example: 3 }

    # ======================== 开源工具 ========================

    ToolItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Prometheus }
        slug: { type: string, example: prometheus }
        summary: { type: string, maxLength: 500 }
        logo: { type: string, maxLength: 512 }
        repoUrl: { type: string, description: 仅 http/https, maxLength: 512 }
        homepageUrl: { type: string, maxLength: 512 }
        license: { type: string, description: SPDX 标识, example: Apache-2.0 }
        language: { type: string, example: Go }
        stars: { type: integer, format: int64, example: 56000 }
        forkCount: { type: integer, format: int64, example: 9200 }
        deployModes:
          type: array
          description: 白名单取值 binary / docker / helm / k8s-operator / source / cloud
          items: { type: string }
          example: [docker, helm, binary]
        tags: { type: array, items: { type: string }, example: [监控, 时序数据库] }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        categorySlug: { type: string }
        featured: { type: boolean }
        viewCount: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time, nullable: true }

    ToolDetail:
      allOf:
        - $ref: '#/components/schemas/ToolItem'
        - type: object
          properties:
            content: { type: string, description: 正文（Markdown）, maxLength: 100000 }
            seo: { $ref: '#/components/schemas/SEOInfo' }
            starsUpdated: { type: string, format: date-time, nullable: true }
            related:
              type: array
              items: { $ref: '#/components/schemas/ToolItem' }

    ToolFilters:
      type: object
      description: 筛选器可选值。languages / licenses 从真实数据聚合，deployModes 为后端白名单。
      properties:
        languages: { type: array, items: { type: string }, example: [Go, TypeScript, Python] }
        licenses: { type: array, items: { type: string }, example: [Apache-2.0, MIT] }
        deployModes:
          type: array
          items: { type: string }
          example: [binary, docker, helm, k8s-operator, source, cloud]

    AdminToolItem:
      allOf:
        - $ref: '#/components/schemas/ToolItem'
        - type: object
          properties:
            status: { type: string, enum: [draft, published, offline] }
            sort: { type: integer }
            authorId: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    AdminToolDetail:
      allOf:
        - $ref: '#/components/schemas/AdminToolItem'
        - type: object
          properties:
            content: { type: string, maxLength: 100000 }
            seo: { $ref: '#/components/schemas/SEOInfo' }

    ToolCreateReq:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128, example: Terraform }
        slug: { type: string, description: 省略时由名称推导, maxLength: 128 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 100000 }
        logo: { type: string, maxLength: 512 }
        repoUrl:
          type: string
          description: 必须以 http:// 或 https:// 开头，否则返回 40019
          maxLength: 512
        homepageUrl: { type: string, maxLength: 512 }
        license: { type: string, maxLength: 64, example: BUSL-1.1 }
        language: { type: string, maxLength: 64, example: Go }
        stars: { type: integer, format: int64, minimum: 0 }
        forkCount: { type: integer, format: int64, minimum: 0 }
        deployModes:
          type: array
          description: 白名单取值，超出返回 40018；最多 8 个
          items: { type: string }
        tags: { type: array, description: 最多 10 个，单个不超过 32 字, items: { type: string } }
        categoryId: { type: integer, format: int64 }
        seoTitle: { type: string, maxLength: 255 }
        seoDescription: { type: string, maxLength: 500 }
        seoKeywords: { type: string, maxLength: 500 }
        featured: { type: boolean, default: false }
        sort: { type: integer, default: 0 }
        status: { type: string, enum: [draft, published], default: draft }

    ToolUpdateReq:
      type: object
      description: 指针字段语义为「未传即不改」
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, maxLength: 128 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 100000 }
        logo: { type: string, maxLength: 512 }
        repoUrl: { type: string, maxLength: 512 }
        homepageUrl: { type: string, maxLength: 512 }
        license: { type: string, maxLength: 64 }
        language: { type: string, maxLength: 64 }
        stars: { type: integer, format: int64, minimum: 0 }
        forkCount: { type: integer, format: int64, minimum: 0 }
        deployModes: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        categoryId: { type: integer, format: int64 }
        seoTitle: { type: string, maxLength: 255 }
        seoDescription: { type: string, maxLength: 500 }
        seoKeywords: { type: string, maxLength: 500 }
        featured: { type: boolean }
        sort: { type: integer }

    # ======================== 资源下载 ========================

    ResourceItem:
      type: object
      description: 资源卡片。刻意不含 fileKey 与下载直链。
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        cover: { type: string, maxLength: 512 }
        fileName: { type: string, example: nginx-log-rotate.sh }
        fileSize: { type: integer, format: int64, description: 字节，由服务端实测, example: 2048 }
        fileExt: { type: string, example: sh }
        checksum: { type: string, description: SHA256 十六进制，由服务端实测 }
        version: { type: string, maxLength: 64, example: v1.2.0 }
        compatibleWith: { type: string, maxLength: 255, example: nginx 1.20+ }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        categorySlug: { type: string }
        tags: { type: array, items: { type: string } }
        needLogin: { type: boolean, description: 为 true 时未登录取下载地址返回 40031 }
        downloadCount: { type: integer, format: int64 }
        viewCount: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time, nullable: true }

    ResourceDetail:
      allOf:
        - $ref: '#/components/schemas/ResourceItem'
        - type: object
          properties:
            content: { type: string, description: 使用说明, maxLength: 2000 }
            related:
              type: array
              items: { $ref: '#/components/schemas/ResourceItem' }

    AdminResourceItem:
      allOf:
        - $ref: '#/components/schemas/ResourceItem'
        - type: object
          properties:
            status: { type: string, enum: [draft, pending, published, rejected, offline], description: pending/rejected 来自用户投稿 }
            authorId: { type: integer, format: int64 }
            reviewNote: { type: string, description: 驳回原因，仅 rejected 时有值；投稿人要能看到为什么被拒 }
            reviewerId: { type: integer, format: int64, description: 审核人用户 ID }
            reviewedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    AdminResourceDetail:
      allOf:
        - $ref: '#/components/schemas/AdminResourceItem'
        - type: object
          properties:
            content: { type: string, maxLength: 2000 }
            fileKey: { type: string, description: 存储 key，替换文件时回传 }

    ResourceDownload:
      type: object
      properties:
        url: { type: string, description: 带签名的下载地址，有时效 }
        expireAt: { type: integer, format: int64, description: 签名失效时间戳（秒） }
        fileName: { type: string }
        fileSize: { type: integer, format: int64 }
        checksum: { type: string }
        version: { type: string }

    ResourceCreateReq:
      type: object
      required: [title, fileKey]
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 2000 }
        cover: { type: string, maxLength: 512 }
        fileKey:
          type: string
          description: 必须由 POST /upload 以 scene=resource_file 返回，否则 40030
        fileName:
          type: string
          description: 只用于展示与推导扩展名；大小与校验和一律实测，不采信此值
        version: { type: string, maxLength: 64 }
        compatibleWith: { type: string, maxLength: 255 }
        categoryId: { type: integer, format: int64 }
        tags: { type: array, items: { type: string } }
        needLogin: { type: boolean, default: false }
        status: { type: string, enum: [draft, published], default: draft }

    ResourceUpdateReq:
      type: object
      description: 指针字段语义为「未传即不改」；传了 fileKey 才做文件替换
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 2000 }
        cover: { type: string, maxLength: 512 }
        fileKey: { type: string }
        fileName: { type: string }
        version: { type: string, maxLength: 64 }
        compatibleWith: { type: string, maxLength: 255 }
        categoryId: { type: integer, format: int64 }
        tags: { type: array, items: { type: string } }
        needLogin: { type: boolean }

    # ======================== 运维题库 ========================

    QuizOptionItem:
      type: object
      properties:
        key: { type: string, description: A/B/C/D…, example: A }
        text: { type: string, example: 被 OOM Killer 杀掉 }

    QuizQuestionItem:
      type: object
      description: 题目卡片。刻意不含 correct 与 analysis，防止答案随列表泄露。
      properties:
        id: { type: integer, format: int64 }
        stem: { type: string, maxLength: 2000 }
        type: { type: string, enum: [single, multiple, judge] }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuizOptionItem' }
        difficulty: { type: string, enum: [easy, medium, hard] }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        categorySlug: { type: string }
        tags: { type: array, items: { type: string } }
        answerCount: { type: integer, format: int64, description: 去重后的作答人数 }
        correctRate: { type: number, format: double, description: 正确率百分比, example: 62.5 }
        publishedAt: { type: string, format: date-time, nullable: true }

    AdminQuizItem:
      allOf:
        - $ref: '#/components/schemas/QuizQuestionItem'
        - type: object
          properties:
            correct: { type: array, description: 正确选项 key 集合, items: { type: string }, example: [A, C] }
            analysis: { type: string, maxLength: 2000 }
            status: { type: string, enum: [draft, published, offline] }
            authorId: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    QuizAnswerReq:
      type: object
      required: [chosen]
      properties:
        chosen:
          type: array
          description: 用户选的选项 key，至少一个、最多 8 个
          minItems: 1
          maxItems: 8
          items: { type: string }
          example: [A]

    QuizAnswerResult:
      type: object
      properties:
        questionId: { type: integer, format: int64 }
        chosen: { type: array, items: { type: string } }
        correct: { type: boolean }
        correctOptions: { type: array, items: { type: string } }
        analysis: { type: string, description: 答对答错都返回 }
        fresh: { type: boolean, description: 是否首次作答；重复作答不累加统计 }

    QuizSubmitItem:
      type: object
      required: [questionId, chosen]
      properties:
        questionId: { type: integer, format: int64 }
        chosen: { type: array, minItems: 1, maxItems: 8, items: { type: string } }

    QuizSubmitReq:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/QuizSubmitItem' }
        durationSec: { type: integer, format: int64, description: 0 表示前端未计时, default: 0 }
        categoryId: { type: integer, format: int64, description: 非 0 表示按分类刷题 }

    QuizSubmitResult:
      type: object
      properties:
        attemptId: { type: integer, format: int64 }
        questionCount: { type: integer, format: int64 }
        correctCount: { type: integer, format: int64 }
        score: { type: integer, description: 百分制，四舍五入, example: 67 }
        durationSec: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuizAnswerResult' }

    QuizAttemptItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        questionCount: { type: integer, format: int64 }
        correctCount: { type: integer, format: int64 }
        score: { type: integer }
        durationSec: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    QuizStats:
      type: object
      properties:
        totalAnswered: { type: integer, format: int64, description: 去重后的作答题数，非作答次数 }
        totalCorrect: { type: integer, format: int64 }
        accuracy: { type: number, format: double, example: 40 }
        wrongCount: { type: integer, format: int64 }
        attemptCount: { type: integer, format: int64 }

    QuizWrongItem:
      type: object
      description: 错题本条目，口径为「最近一次作答仍然答错」
      properties:
        questionId: { type: integer, format: int64 }
        stem: { type: string }
        type: { type: string, enum: [single, multiple, judge] }
        difficulty: { type: string, enum: [easy, medium, hard] }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuizOptionItem' }
        chosen: { type: array, items: { type: string } }
        correctOptions: { type: array, items: { type: string } }
        analysis: { type: string }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        lastWrongAt: { type: string, format: date-time }

    QuizQuestionCreateReq:
      type: object
      required: [stem, correct]
      properties:
        stem: { type: string, maxLength: 2000 }
        type:
          type: string
          description: 省略按单选处理
          enum: [single, multiple, judge]
          default: single
        options:
          type: array
          description: |
            判断题可以整个省略——选项固定为「正确 / 错误」，由服务端填充，
            避免"对/错""是/否""True/False"三种写法并存。
            单选与多选必传，个数 2–8；只传 1 个或超过 8 个会被拒。
          minItems: 2
          maxItems: 8
          items: { $ref: '#/components/schemas/QuizOptionInput' }
        correct:
          type: array
          description: 正确选项 key 集合。多选传多个；单选与判断只能传一个；多选不可覆盖全部选项。
          minItems: 1
          maxItems: 8
          items: { type: string }
        analysis: { type: string, maxLength: 2000 }
        difficulty: { type: string, enum: [easy, medium, hard], default: medium }
        categoryId: { type: integer, format: int64 }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, published], default: draft }

    QuizOptionInput:
      type: object
      required: [key, text]
      properties:
        key: { type: string, example: A }
        text: { type: string }

    QuizQuestionUpdateReq:
      type: object
      description: 指针字段语义为「未传即不改」
      properties:
        stem: { type: string, maxLength: 2000 }
        type: { type: string, enum: [single, multiple, judge] }
        options:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: '#/components/schemas/QuizOptionInput' }
        correct: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
        analysis: { type: string, maxLength: 2000 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        categoryId: { type: integer, format: int64 }
        tags: { type: array, items: { type: string } }

    # ======================== 文件上传 ========================

    UploadSceneItem:
      type: object
      properties:
        scene: { type: string, example: resource_file }
        desc: { type: string, example: 资源下载文件 }
        maxSizeMb: { type: number, format: double, example: 50 }
        mimes: { type: array, items: { type: string } }
        private: { type: boolean, description: 为 true 时 URL 带签名且有有效期 }
        accept: { type: string, description: 可直接用于 input 的 accept 属性 }

    UploadResult:
      type: object
      properties:
        key:
          type: string
          description: 存储标识。后续引用该文件时传 key 而不是 URL——URL 会随域名与签名策略变化
        url: { type: string, description: 可直接访问的地址；私有文件为带签名的临时地址 }
        name: { type: string, description: 原始文件名，仅用于回显 }
        size: { type: integer, format: int64 }
        mime: { type: string }
        private: { type: boolean }
        expireAt: { type: integer, format: int64, description: 私有文件签名到期时间（Unix 秒）；公开文件为 0 }

    # ======================== 专家域 ========================

    FileRef:
      type: object
      description: 文件引用。key 是稳定标识，url 是可直接访问的地址。
      properties:
        key: { type: string }
        url: { type: string }
        expireAt: { type: integer, format: int64, description: 私有文件签名过期时间；公开文件省略 }

    ExpertSkillReq:
      type: object
      required: [skillId]
      properties:
        skillId: { type: integer, format: int64 }
        level: { type: string, enum: [junior, senior, expert] }
        years: { type: integer, minimum: 0, maximum: 60 }

    ExpertSkillItem:
      type: object
      properties:
        skillId: { type: integer, format: int64 }
        name: { type: string, example: Kubernetes }
        category: { type: string, example: 容器与编排 }
        level: { type: string, enum: [junior, senior, expert] }
        years: { type: integer }

    ExpertApplyReq:
      type: object
      required: [realName, idCardNo, certFiles, intro, skills, serviceModes]
      properties:
        realName: { type: string, minLength: 2, maxLength: 32 }
        idCardNo: { type: string, description: 二代身份证 18 位；不会出现在任何出参里, minLength: 18, maxLength: 18 }
        certFiles:
          type: array
          description: 上传接口返回的 key 列表，不是 URL；最多 10 个
          minItems: 1
          maxItems: 10
          items: { type: string }
        intro: { type: string, description: 个人简介, minLength: 20, maxLength: 2000 }
        experience: { type: string, maxLength: 2000 }
        avatar: { type: string, description: 头像文件 key }
        skills:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/ExpertSkillReq' }
        serviceModes: { type: array, minItems: 1, items: { type: string }, example: [online, onsite] }
        pricePerHourCents: { type: integer, format: int64, description: 按小时定价（分），0 表示未定价 }
        pricePerTaskCents: { type: integer, format: int64, description: 按次定价（分），0 表示未定价 }

    ExpertApplyDraft:
      type: object
      description: 被驳回后可复用的申请内容。故意不含身份证号明文。
      properties:
        realName: { type: string }
        intro: { type: string }
        experience: { type: string }
        avatar: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/ExpertSkillItem' }
        serviceModes: { type: array, items: { type: string } }
        pricePerHourCents: { type: integer, format: int64 }
        pricePerTaskCents: { type: integer, format: int64 }
        certFiles:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }

    ExpertApplyStatus:
      type: object
      properties:
        status: { type: string, enum: [none, pending, approved, rejected, suspended] }
        auditRemark: { type: string, description: 驳回原因 }
        realName: { type: string }
        maskedIDCard: { type: string, description: 脱敏证件号, example: '3301**********1234' }
        appliedAt: { type: string, format: date-time, nullable: true }
        auditedAt: { type: string, format: date-time, nullable: true }
        draft:
          allOf:
            - $ref: '#/components/schemas/ExpertApplyDraft'
          description: 仅在被驳回（rejected）时返回

    ExpertCard:
      type: object
      description: 专家卡片，字段顺序即前端展示优先级。
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        avatar: { type: string }
        realNameVerified: { type: boolean }
        skills:
          type: array
          items: { $ref: '#/components/schemas/ExpertSkillItem' }
        rating: { type: number, format: double, example: 4.9 }
        orderCount: { type: integer, format: int64 }
        goodRate: { type: number, format: double, description: 好评率百分比, example: 98.5 }
        pricePerHourCents: { type: integer, format: int64 }
        pricePerTaskCents: { type: integer, format: int64 }
        acceptingOrder: { type: boolean }
        serviceModes: { type: array, items: { type: string } }

    ExpertDetail:
      allOf:
        - $ref: '#/components/schemas/ExpertCard'
        - type: object
          properties:
            intro: { type: string }
            experience: { type: string }
            resolveRate: { type: number, format: double, description: 解决率百分比 }
            avgResponseSec: { type: integer, format: int64, description: 平均响应时长（秒） }
            appliedAt: { type: string, format: date-time, nullable: true }
            joinedAt: { type: string, format: date-time }

    ExpertReviewPage:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/ExpertReviewSummary' }
        list:
          type: array
          items: { $ref: '#/components/schemas/ExpertReviewItem' }
        total: { type: integer, format: int64, description: 全部评价条数，不是本页条数 }
        page: { type: integer }
        pageSize: { type: integer }

    ExpertReviewSummary:
      type: object
      description: >-
        avgScore 在没有任何评价时为 0，前端据此区分「新专家」与「评分很差」——
        0 分和「还没人评」在展示上是两件事。
      properties:
        total: { type: integer, format: int64 }
        avgScore: { type: number, format: double, description: 平均分，保留一位小数 }
        goodRate: { type: number, format: double, description: 好评率百分比（4 星及以上） }
        distribution:
          type: array
          description: 固定 5..1 五档，没有数据的那档 count 为 0
          items: { $ref: '#/components/schemas/ScoreBucket' }

    ScoreBucket:
      type: object
      properties:
        score: { type: integer, description: '星级 1-5' }
        count: { type: integer, format: int64 }

    ExpertReviewItem:
      type: object
      description: >-
        刻意不含 orderId / userId：评价区是公开页面，订单号能反查下单人。
        匿名评价连昵称头像一起抹掉，只留「匿名用户」。
      properties:
        nickname: { type: string }
        avatar: { type: string }
        score: { type: integer }
        professionalScore: { type: integer }
        speedScore: { type: integer }
        communicationScore: { type: integer }
        content: { type: string }
        recommend: { type: boolean }
        anonymous: { type: boolean }
        reply: { type: string }
        repliedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ExpertServiceUpdateReq:
      type: object
      description: 指针字段语义为「未传即不改」
      properties:
        skills:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/ExpertSkillReq' }
        serviceModes: { type: array, items: { type: string } }
        pricePerHourCents: { type: integer, format: int64, description: '100 ~ 10000000（分）' }
        pricePerTaskCents: { type: integer, format: int64 }
        acceptingOrder: { type: boolean }

    ExpertProfileUpdateReq:
      type: object
      properties:
        intro: { type: string, minLength: 20, maxLength: 2000 }
        experience: { type: string, maxLength: 2000 }
        avatar: { type: string, description: 头像文件 key }

    ExpertDashboard:
      type: object
      properties:
        orderCount: { type: integer, format: int64 }
        pendingAccept: { type: integer, format: int64 }
        monthIncomeCents: { type: integer, format: int64 }
        rating: { type: number, format: double }
        goodRate: { type: number, format: double }
        balanceCents: { type: integer, format: int64 }
        frozenCents: { type: integer, format: int64 }
        totalIncomeCents: { type: integer, format: int64 }
        acceptingOrder: { type: boolean }
        status: { type: string, enum: [none, pending, approved, rejected, suspended] }

    SettlementItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        settlementNo: { type: string }
        orderId: { type: integer, format: int64 }
        orderNo: { type: string }
        amountCents: { type: integer, format: int64, description: 订单金额（分） }
        commissionCents: { type: integer, format: int64, description: 平台抽成（分） }
        expertAmountCents: { type: integer, format: int64, description: 专家实得（分） }
        status: { type: string }
        settledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    WithdrawalItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        withdrawalNo: { type: string }
        amountCents: { type: integer, format: int64, description: 申请金额（分） }
        feeCents: { type: integer, format: int64, description: 手续费（分） }
        actualCents: { type: integer, format: int64, description: 实际到账（分） }
        accountType: { type: string, enum: [bank, alipay, wechat] }
        accountName: { type: string }
        accountNoMasked: { type: string, description: 脱敏账号 }
        status: { type: string }
        remark: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }

    WithdrawalCreateReq:
      type: object
      required: [amountCents, accountType, accountName, accountNo]
      properties:
        amountCents: { type: integer, format: int64, description: 最少 1000 分（10 元） }
        accountType: { type: string, enum: [bank, alipay, wechat] }
        accountName: { type: string }
        accountNo: { type: string, description: 出参一律脱敏返回 }

    ExpertWallet:
      type: object
      properties:
        balanceCents: { type: integer, format: int64 }
        frozenCents: { type: integer, format: int64 }
        totalIncomeCents: { type: integer, format: int64 }
        pendingWithdrawCents: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/SettlementItem' }
        withdrawals:
          type: array
          items: { $ref: '#/components/schemas/WithdrawalItem' }

    SkillItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Kubernetes }
        category: { type: string }
        sort: { type: integer }
        expertCount: { type: integer, format: int64 }

    FinanceDailyRow:
      type: object
      description: 一天的对账行。四组列各自按自己的事发时间归日。
      properties:
        day: { type: string, format: date }
        paidCount: { type: integer, format: int64, description: 当天收款的订单数 }
        paidAmountCents: { type: integer, format: int64, description: 当天收款总额（分） }
        paidCommissionCents: { type: integer, format: int64, description: 这些订单上的平台佣金快照（分） }
        paidExpertCents: { type: integer, format: int64, description: 这些订单上的专家应得快照（分） }
        refundCount: { type: integer, format: int64 }
        refundCents: { type: integer, format: int64, description: 当天退出去的钱（分） }
        settleCount: { type: integer, format: int64 }
        settledCommissionCents: { type: integer, format: int64, description: 当天结算确认的平台佣金（分） }
        settledExpertCents: { type: integer, format: int64, description: 当天进入专家余额的钱（分） }
        withdrawCount: { type: integer, format: int64 }
        withdrawAmountCents: { type: integer, format: int64, description: 当天打款的提现申请金额（分） }
        withdrawFeeCents: { type: integer, format: int64, description: 其中的手续费（分，留在平台） }
        withdrawActualCents: { type: integer, format: int64, description: 真正打出去的钱（分） }
        netCashCents: { type: integer, format: int64, description: 当天现金净流入 = 收款 − 退款 − 提现实付（分） }

    FinancePeriodSummary:
      type: object
      description: 区间合计，字段与日行一一对应；days 是区间天数（含没有流水的日子）。
      properties:
        days: { type: integer, format: int64 }
        paidCount: { type: integer, format: int64 }
        paidAmountCents: { type: integer, format: int64 }
        paidCommissionCents: { type: integer, format: int64 }
        paidExpertCents: { type: integer, format: int64 }
        refundCount: { type: integer, format: int64 }
        refundCents: { type: integer, format: int64 }
        settleCount: { type: integer, format: int64 }
        settledCommissionCents: { type: integer, format: int64 }
        settledExpertCents: { type: integer, format: int64 }
        withdrawCount: { type: integer, format: int64 }
        withdrawAmountCents: { type: integer, format: int64 }
        withdrawFeeCents: { type: integer, format: int64 }
        withdrawActualCents: { type: integer, format: int64 }
        netCashCents: { type: integer, format: int64 }

    FinanceOwed:
      type: object
      description: 平台当前欠出去的钱，按当前时点而不是按区间统计。
      properties:
        escrowCents: { type: integer, format: int64, description: 已收款但还没结算的订单金额（已扣退款） }
        escrowCount: { type: integer, format: int64 }
        expertBalanceCents: { type: integer, format: int64, description: 专家可提现余额合计 }
        expertFrozenCents: { type: integer, format: int64, description: 提现申请中冻结的合计 }
        expertCount: { type: integer, format: int64 }
        pendingWithdrawCents: { type: integer, format: int64, description: 待审核 + 待打款的提现合计 }

    FinanceTotals:
      type: object
      description: 全时段累计，不受日期区间影响。
      properties:
        paidAmountCents: { type: integer, format: int64 }
        refundCents: { type: integer, format: int64 }
        withdrawActualCents: { type: integer, format: int64 }
        netCashCents: { type: integer, format: int64 }
        commissionCents: { type: integer, format: int64, description: 已结算佣金累计（平台确认的收入） }

    FinanceCheck:
      type: object
      description: 一条账面恒等式校验。
      properties:
        key: { type: string, example: expert_ledger }
        name: { type: string, example: 专家台账（累计收入 = 可提余额 + 冻结 + 已打款） }
        level:
          type: string
          enum: [error, warn]
          description: error 表示账不平；warn 表示数据不全但不破坏恒等式（如历史退款缺时间）
        ok: { type: boolean }
        message: { type: string }
        checked: { type: integer, format: int64, description: 参与检查的记录数 }
        samples:
          type: array
          description: 最多 10 条样本，够定位即可
          items: { type: string }

    FinanceReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        summary: { $ref: '#/components/schemas/FinancePeriodSummary' }
        rows:
          type: array
          description: 连续日期，没有流水的日子也会有一行全 0，不会缺格
          items: { $ref: '#/components/schemas/FinanceDailyRow' }
        owed: { $ref: '#/components/schemas/FinanceOwed' }
        totals: { $ref: '#/components/schemas/FinanceTotals' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/FinanceCheck' }

    FinanceDayOrder:
      type: object
      properties:
        orderNo: { type: string }
        title: { type: string }
        status: { type: string }
        amountCents: { type: integer, format: int64 }
        commissionCents: { type: integer, format: int64 }
        expertAmountCents: { type: integer, format: int64 }
        refundCents: { type: integer, format: int64 }
        paidAt: { type: string, format: date-time, nullable: true }
        refundedAt: { type: string, format: date-time, nullable: true }

    FinanceDaySettlement:
      type: object
      properties:
        settlementNo: { type: string }
        orderNo: { type: string }
        expertId: { type: integer, format: int64 }
        amountCents: { type: integer, format: int64 }
        commissionCents: { type: integer, format: int64 }
        expertAmountCents: { type: integer, format: int64 }
        settledAt: { type: string, format: date-time, nullable: true }

    FinanceDayWithdrawal:
      type: object
      properties:
        withdrawalNo: { type: string }
        expertId: { type: integer, format: int64 }
        amountCents: { type: integer, format: int64 }
        feeCents: { type: integer, format: int64 }
        actualCents: { type: integer, format: int64 }
        accountName: { type: string }
        accountNoMasked: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }

    FinanceDayDetail:
      type: object
      description: 单日明细。三组分开返回——字段完全不同，硬拼成一张表谁都不好读。
      properties:
        day: { type: string, format: date }
        orders:
          type: array
          items: { $ref: '#/components/schemas/FinanceDayOrder' }
        settlements:
          type: array
          items: { $ref: '#/components/schemas/FinanceDaySettlement' }
        withdrawals:
          type: array
          items: { $ref: '#/components/schemas/FinanceDayWithdrawal' }

    CommissionSettingView:
      type: object
      properties:
        rateBp: { type: integer, example: 1500, description: 当前生效的抽佣基点，1500 = 15% }
        defaultRateBp: { type: integer, example: 1500, description: 配置文件里的出厂值 }
        isOverride: { type: boolean, description: 后台改过则为 true }
        updatedAt: { type: string, format: date-time, nullable: true, description: 最后一次修改时间；未覆盖时为空 }
        updatedBy: { type: integer, format: int64, description: 最后修改人用户 ID }

    AdminSettingOverview:
      type: object
      properties:
        commission: { $ref: '#/components/schemas/CommissionSettingView' }

    AdminCommissionUpdateReq:
      type: object
      required: [rateBp]
      properties:
        rateBp: { type: integer, minimum: 0, maximum: 5000, example: 1500, description: 基点，1500 = 15% }

    AdminSkillItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string, example: 云原生 }
        sort: { type: integer }
        enabled: { type: boolean }
        expertCount: { type: integer, format: int64, description: 被多少位专家档案引用；有引用时不能删除 }

    AdminSkillCreateReq:
      type: object
      required: [name, category]
      properties:
        name: { type: string, maxLength: 32, example: etcd }
        category: { type: string, maxLength: 32, example: 云原生 }
        sort: { type: integer, default: 0 }
        enabled: { type: boolean, default: true }

    AdminSkillUpdateReq:
      type: object
      description: 全字段可选，未传的字段不改。
      properties:
        name: { type: string, maxLength: 32 }
        category: { type: string, maxLength: 32 }
        sort: { type: integer }
        enabled: { type: boolean }

    AdminUserItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        avatar: { type: string }
        maskedPhone: { type: string, example: '138****8000', description: 未绑手机号时为空串 }
        email: { type: string }
        role: { type: string, enum: [user, expert, admin] }
        status: { type: string, enum: [active, disabled] }
        statusReason: { type: string, description: 当前状态的变更原因；解封后清空，历史留在审计日志 }
        statusChangedAt: { type: string, format: date-time, nullable: true }
        expertId: { type: integer, format: int64, description: 0 表示这个人没有专家档案 }
        expertStatus: { type: string, description: 'pending / approved / rejected / suspended，无档案时为空串' }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    AdminUserOrderStats:
      type: object
      properties:
        asUserTotal: { type: integer, format: int64, description: 作为下单人的订单数 }
        asUserPaidCents: { type: integer, format: int64, description: 其中已支付的总额（分） }
        asExpertTotal: { type: integer, format: int64, description: 作为专家的订单数 }
        asExpertIncomeCents: { type: integer, format: int64, description: 已完成 / 已结算订单的专家实收（分） }
        activeCount: { type: integer, format: int64, description: 在途订单数；封禁前要看一眼，这些单子不会自动取消 }

    AdminUserExpert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        realName: { type: string }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        rating: { type: number, format: double }
        orderCount: { type: integer, format: int64 }
        balanceCents: { type: integer, format: int64 }
        frozenCents: { type: integer, format: int64 }
        totalIncomeCents: { type: integer, format: int64 }
        acceptingOrder: { type: boolean }
        pricePerHourCents: { type: integer, format: int64 }
        pricePerTaskCents: { type: integer, format: int64 }
        auditRemark: { type: string }
        appliedAt: { type: string, format: date-time }
        auditedAt: { type: string, format: date-time, nullable: true }

    AdminAuditItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, example: user.disable, description: '<对象>.<动词>，如 user.disable / user.enable / user.role' }
        userRole: { type: string, description: 操作人角色快照 }
        detail: { type: object, additionalProperties: true, description: '变更明细，如 { from, to, reason }' }
        ip: { type: string }
        createdAt: { type: string, format: date-time }

    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserItem'
        - type: object
          properties:
            orderStats: { $ref: '#/components/schemas/AdminUserOrderStats' }
            expert:
              description: 非专家时为 null
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AdminUserExpert'
            auditLogs:
              type: array
              items: { $ref: '#/components/schemas/AdminAuditItem' }

    AdminUpdateStatusReq:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled], description: '用显式取值而不是 disabled:true —— 布尔缺省即 false，会把「封禁」变成「解封」' }
        reason: { type: string, maxLength: 255, description: 封禁必填；解封时会忽略并清空 }

    AdminUpdateRoleReq:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [user, expert, admin] }

    AdminExpertItem:
      allOf:
        - $ref: '#/components/schemas/ExpertCard'
        - type: object
          properties:
            realName: { type: string }
            maskedIDCard: { type: string }
            status: { type: string, enum: [pending, approved, rejected, suspended] }
            auditRemark: { type: string }
            appliedAt: { type: string, format: date-time, nullable: true }
            auditedAt: { type: string, format: date-time, nullable: true }

    AdminExpertDetail:
      allOf:
        - $ref: '#/components/schemas/AdminExpertItem'
        - type: object
          properties:
            intro: { type: string }
            experience: { type: string }
            certFiles:
              type: array
              items: { $ref: '#/components/schemas/FileRef' }

    ExpertAuditReq:
      type: object
      properties:
        approved: { type: boolean, description: true 通过 / false 驳回 }
        remark: { type: string, description: 驳回时会回显给申请人 }

    # ============================ 悬赏问题 ============================

    QuestionCreateReq:
      type: object
      required: [title, description, skillIds, budgetCents]
      properties:
        title: { type: string, minLength: 5, maxLength: 200, example: K8s 节点频繁 NotReady 排查 }
        description: { type: string, minLength: 10, maxLength: 5000, description: 运维问题要排障，少于 10 字基本无法判断现象 }
        attachments:
          type: array
          maxItems: 6
          description: 上传接口返回的 key 列表，不是 URL。必须以 question/ 开头（问题附件场景）
          items: { type: string }
        skillIds:
          type: array
          minItems: 1
          maxItems: 5
          description: 技能标签 ID 字符串数组。注意 /skills 返回的 id 是数字，提交前需转成字符串
          items: { type: string }
        budgetCents: { type: integer, format: int64, description: 悬赏金额（分），1000 ~ 500000 }
        expectResponseMin: { type: integer, description: 期望响应时长（分钟），有取值范围校验 }
        expireHours: { type: integer, description: 有效期（小时），不传用默认值 }

    QuestionCancelReq:
      type: object
      properties:
        reason: { type: string, maxLength: 200 }

    QuestionItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        skillIds: { type: array, items: { type: string } }
        budgetCents: { type: integer, format: int64, description: 悬赏金额（分） }
        status: { type: string, enum: [open, matched, cancelled, expired] }
        expiredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        matchedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }

    QuestionDetail:
      allOf:
        - $ref: '#/components/schemas/QuestionItem'
        - type: object
          properties:
            # 前端要据此给出"去支付 / 看订单"的入口，所以详情必须带上订单标识
            orderNo: { type: string }
            orderStatus: { type: string, description: 订单状态机里的机器值 }
            orderId: { type: integer, format: int64 }

    HallItem:
      description: 接单大厅的一条悬赏。内容取自问题，另带抢单要用的订单标识
      allOf:
        - $ref: '#/components/schemas/QuestionItem'
        - type: object
          properties:
            orderId: { type: integer, format: int64 }
            orderNo: { type: string, description: 抢单接口要传的标识 }

    # ============================ 订单 ============================

    OrderCreateReq:
      type: object
      required: [expertUserId, serviceMode]
      properties:
        expertUserId:
          type: integer
          format: int64
          description: |
            **专家本人的用户 ID**，不是专家档案 ID。

            两个 ID 在接口里同时存在（`ExpertCard.id` 是档案 ID，`ExpertCard.userId` 是用户 ID），
            传成档案 ID 会落到另一个人身上或查不到。订单表里的 expert_id 一直存 users.id，这里跟随同一语义。
        title: { type: string, description: 不传时服务端按"专家名 + 服务方式"生成 }
        serviceMode: { type: string, enum: [im, voice, video, screen] }
        bookedAt: { type: string, format: date-time, nullable: true, description: 不能早于当前时间 }
        durationMin: { type: integer, minimum: 0, description: 预约时长（分钟），与专家的按小时定价相乘得出金额 }
        remark: { type: string, maxLength: 500 }

    OrderPayReq:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          example: offline
          description: |
            通道名不在这里做枚举约束——可选范围由后端装配的 provider 决定，
            写死在文档/结构体里就是维护第二份通道清单。
            不认识 → 400；认识但未接通 → 501。可用清单见 `GET /api/v1/orders/pay-channels`。
        openId: { type: string, description: 微信 JSAPI 支付需要，其他通道可忽略 }

    PayChannelItem:
      type: object
      properties:
        name: { type: string, enum: [mock, offline, wechat, alipay] }
        label: { type: string, example: 线下转账 }
        available: { type: boolean, description: false 表示已实现但未开通，前端应置灰而非隐藏 }
        current: { type: boolean, description: 当前服务实际装配的通道 }

    OrderPayResult:
      type: object
      properties:
        orderNo: { type: string }
        channel: { type: string, description: 本次发起所用的通道 }
        paid: { type: boolean, description: true 表示这次请求已经把订单置为已支付 }
        manual: { type: boolean, description: true 时不能在线唤起支付，前端要展示 instruction }
        instruction: { type: string, description: 给用户看的下一步说明 }
        params: { type: object, additionalProperties: { type: string }, description: 唤起支付所需参数，结构由通道决定，前端原样透传 }

    OrderCancelReq:
      type: object
      properties:
        reason: { type: string, maxLength: 200 }

    OrderItem:
      type: object
      description: |
        不带状态中文标签：前端读自己的 orderStatusMap。后端再输出一份标签就等于有两个真相来源。
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string }
        type: { type: string, enum: [question, booking] }
        status:
          type: string
          enum: [pending_accept, pending_pay, in_service, pending_confirm, completed, settled, cancelled, refunded, disputed]
        title: { type: string }
        serviceMode: { type: string }
        userId: { type: integer, format: int64 }
        expertId: { type: integer, format: int64, description: 服务专家的**用户 ID** }
        expertName: { type: string, description: 展示用昵称，列表页不用再发一轮请求 }
        userName: { type: string }
        questionId: { type: integer, format: int64 }
        amountCents: { type: integer, format: int64, description: 订单金额（分） }
        commissionCents: { type: integer, format: int64, description: 平台佣金（分） }
        expertAmountCents: { type: integer, format: int64, description: 专家实收（分）。恒有 commission + expert == amount }
        payChannel: { type: string }
        reviewed: { type: boolean, description: 前端据此决定"去评价"还是"查看评价" }
        createdAt: { type: string, format: date-time }
        payExpireAt: { type: string, format: date-time, nullable: true, description: 仅 pending_pay 时返回；由前端算剩余秒数，比服务端算好更准 }
        confirmDeadline: { type: string, format: date-time, nullable: true, description: 仅 pending_confirm 时返回 }
        bookedAt: { type: string, format: date-time, nullable: true }
        durationMin: { type: integer }
        remark: { type: string }

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderItem'
        - type: object
          properties:
            cancelReason:
              type: string
              description: >-
                取消原因，仅在已取消时有值。用户主动取消与支付超时被系统关单都落到
                cancelled，只给一个"已取消"等于让用户自己猜发生了什么。
            timeline:
              type: array
              description: 已发生的关键时间点，按时间正序，前端直接渲染成时间轴
              items:
                type: object
                properties:
                  status: { type: string }
                  at: { type: string, format: date-time }
            sessions:
              type: array
              items: { $ref: '#/components/schemas/OrderSessionItem' }
            review: { allOf: [{ $ref: '#/components/schemas/OrderReviewItem' }], nullable: true }
            dispute:
              allOf: [{ $ref: '#/components/schemas/OrderDisputeItem' }]
              nullable: true
              description: 最近一条争议，**包含已结案的**——结案后从详情里消失，用户就只看到"已退款"而找不到结论
            settlement: { allOf: [{ $ref: '#/components/schemas/OrderSettlementItem' }], nullable: true }

    OrderSessionItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        channel: { type: string, enum: [im, voice, video, screen] }
        status: { type: string, enum: [ongoing, ended, cancelled] }
        meetingUrl: { type: string, description: MVP 阶段由双方线下约线上会议，此处一般为空 }
        provider: { type: string, example: manual }
        startTime: { type: string, format: date-time, nullable: true }
        endTime: { type: string, format: date-time, nullable: true }
        durationSec: { type: integer, format: int64, description: 时长由服务端算，不接受客户端传入 }

    OrderReviewReq:
      type: object
      required: [score, content]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        professionalScore: { type: integer, minimum: 1, maximum: 5 }
        speedScore: { type: integer, minimum: 1, maximum: 5 }
        communicationScore: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, description: 有最小与最大长度校验 }
        recommend: { type: boolean }
        anonymous: { type: boolean }

    OrderReviewReplyReq:
      type: object
      required: [reply]
      properties:
        reply: { type: string, maxLength: 1000 }

    OrderReviewAppealReq:
      type: object
      required: [appealText]
      properties:
        appealText: { type: string, maxLength: 1000 }

    OrderReviewItem:
      type: object
      description: 刻意不含任何发布者身份字段，因此匿名与否在订单详情里无需再脱敏
      properties:
        score: { type: integer }
        professionalScore: { type: integer }
        speedScore: { type: integer }
        communicationScore: { type: integer }
        content: { type: string }
        recommend: { type: boolean }
        anonymous: { type: boolean }
        reply: { type: string }
        repliedAt: { type: string, format: date-time, nullable: true }
        appealed: { type: boolean }
        createdAt: { type: string, format: date-time }

    OrderDisputeReq:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: 不少于 10 个字 }
        evidence:
          type: array
          maxItems: 6
          description: 上传接口返回的 key 列表，必须以 question/ 开头
          items: { type: string }

    OrderDisputeItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reason: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        status: { type: string, enum: [open, processing, resolved, rejected] }
        result: { type: string, description: 处理结论 }
        deadline: { type: string, format: date-time, nullable: true, description: 方案约定 3 个工作日，这里按自然日存，展示层折算 }
        createdAt: { type: string, format: date-time }
        handledAt: { type: string, format: date-time, nullable: true }

    OrderSettlementItem:
      type: object
      description: 分账凭证。金额取自下单时的订单快照，不用结算时的抽佣配置重算
      properties:
        settlementNo: { type: string, example: ST20261015212415976405 }
        amountCents: { type: integer, format: int64 }
        commissionCents: { type: integer, format: int64 }
        expertAmountCents: { type: integer, format: int64 }
        commissionRateBp: { type: integer, description: 抽佣比例，基点。1500 表示 15% }
        status: { type: string }
        settledAt: { type: string, format: date-time, nullable: true }

    OrderCounts:
      type: object
      properties:
        total: { type: integer, format: int64 }
        byStatus:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: 只包含有数据的状态，取不到的状态视为 0
          example: { pending_pay: 2, in_service: 1 }

    AdminOrderTransitionReq:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: 目标状态。仍受状态机约束，不接受状态机里不存在的一步
          enum: [pending_accept, pending_pay, in_service, pending_confirm, completed, settled, cancelled, refunded, disputed]
        remark: { type: string, maxLength: 200 }

    AdminOrderMarkPaidReq:
      type: object
      properties:
        thirdPartyNo: { type: string, maxLength: 64, description: 线下转账流水号，对账时要留痕 }
        remark: { type: string, maxLength: 200 }

    AdminSettleReq:
      type: object
      properties:
        remark: { type: string, maxLength: 200 }

    AdminResolveDisputeReq:
      type: object
      required: [resolution, result]
      properties:
        resolution:
          type: string
          enum: [refunded, completed, in_service]
          description: 三种结论直接以订单状态收口，不再套一层 approve/reject 词表
        result: { type: string, description: 处理说明，会回显给订单双方 }

    QuizCategoryItem:
      type: object
      description: 题库的一个方向，含题量与当前用户的进度。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: 云原生 }
        slug: { type: string, example: cloud-native }
        count: { type: integer, format: int64, description: 该方向已发布题目数；为 0 时前端标「筹备中」 }
        answered: { type: integer, format: int64, description: 当前用户在该方向答过的题数（未登录为 0） }
        correct: { type: integer, format: int64, description: 答对的题数（未登录为 0） }

    ArticleContributeReq:
      type: object
      description: 投稿请求。刻意没有 status 字段——是否上线由运营审核决定。
      required: [title, content]
      properties:
        title: { type: string, minLength: 6, maxLength: 200 }
        summary: { type: string, description: 省略时自动从正文截取, maxLength: 500 }
        content: { type: string, description: Markdown 正文, maxLength: 100000 }
        channel:
          type: string
          description: 投稿栏目，省略按 linux-tutorial 处理；不接受 ops-news
          example: linux-tutorial
        categoryId: { type: integer, format: int64, description: 0 表示不指定分类 }
        tags:
          type: array
          maxItems: 5
          items: { type: string }
        cover: { type: string, maxLength: 512 }

    ArticleReviewReq:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
          description: approve 通过并发布；reject 驳回
        note:
          type: string
          maxLength: 500
          description: 审核意见。reject 时必填——驳回不给原因，作者只能反复试错

    MyContributionItem:
      type: object
      description: |
        文章投稿与题目投稿共用这一份结构：前端「我的投稿」是一页两个 tab，
        两套卡片模板只需按 kind 区分图标与链接行为（题目没有单题前台页，不给链接）。
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [article, quiz]
          description: 内容类型。article 是教程投稿，quiz 是题目投稿
        title: { type: string }
        slug: { type: string }
        channel: { type: string }
        status:
          type: string
          enum: [draft, pending, published, rejected, offline]
        reviewNote: { type: string, description: 驳回原因，仅 rejected 时有值 }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        viewCount: { type: integer, format: int64 }

    ToolGuideItem:
      type: object
      description: 工具的一条实战教程关联。站内文章与外链互斥。
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [deploy, implement, optimize, cluster]
          description: deploy 部署 / implement 实施 / optimize 优化 / cluster 集群构建
        title: { type: string }
        url: { type: string, description: 站外教程链接；关联站内文章时为空 }
        articleId: { type: integer, format: int64, description: 关联的站内文章 ID，0 表示外链 }
        articleSlug: { type: string, description: '前端据此跳 #/article/{slug}' }
        summary: { type: string }
        sort: { type: integer }

    ToolGuideReq:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [deploy, implement, optimize, cluster] }
        title: { type: string, maxLength: 200 }
        url: { type: string, description: 站外链接，必须是 http/https, maxLength: 512 }
        articleId: { type: integer, format: int64, description: 关联站内文章时填；文章必须已发布 }
        summary: { type: string, maxLength: 500 }
        sort: { type: integer }

    ToolGuidesReq:
      type: object
      properties:
        guides:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/ToolGuideReq' }

    ResourceLinkItem:
      type: object
      description: 资源的一条外部下载地址。
      properties:
        id: { type: integer, format: int64 }
        label: { type: string, example: Docker Engine 官方安装指引 }
        url: { type: string }
        kind:
          type: string
          enum: [official, mirror, package, repo, image, other]
          description: official 官网 / mirror 镜像 / package 包管理器 / repo 代码仓库 / image 容器镜像
        note: { type: string }
        sort: { type: integer }

    ResourceLinkReq:
      type: object
      required: [url]
      properties:
        label: { type: string, maxLength: 120 }
        url: { type: string, maxLength: 512, description: 必须是 http/https }
        kind:
          type: string
          description: 不认识的取值归一为 other，不报错
          enum: [official, mirror, package, repo, image, other]
        note: { type: string, maxLength: 300 }
        sort: { type: integer }

    ResourceLinksReq:
      type: object
      properties:
        links:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ResourceLinkReq' }

    NewsSourceItem:
      type: object
      description: 一个资讯订阅源及其最近一次抓取结果。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Kubernetes Blog }
        url: { type: string, description: RSS 地址，或 kind=github 时的 owner/repo }
        kind: { type: string, enum: [rss, github] }
        enabled: { type: boolean }
        autoPublish: { type: boolean, description: 默认 false：抓回来先进待采用池 }
        lastFetchedAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, description: ok / failed；空表示从未抓取 }
        lastError: { type: string }
        fetchedCount: { type: integer, format: int64, description: 本源累计写入条数 }
        pendingTotal: { type: integer, format: int64, description: 全部源累计的待采用条数，供页面顶部显示 }

    NewsSourceReq:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 120 }
        url: { type: string, maxLength: 512, description: rss 时填 feed 地址；github 时填 owner/repo }
        kind: { type: string, enum: [rss, github], default: rss }
        categoryId: { type: integer, format: int64 }
        tags:
          type: array
          items: { type: string }
        enabled: { type: boolean, default: true }
        autoPublish: { type: boolean, default: false }
        sort: { type: integer }

    NewsSourceUpdateReq:
      type: object
      description: 局部更新，未传字段保持不变。
      properties:
        name: { type: string, maxLength: 120 }
        url: { type: string, maxLength: 512 }
        kind: { type: string, enum: [rss, github] }
        categoryId: { type: integer, format: int64 }
        tags:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        autoPublish: { type: boolean }
        sort: { type: integer }

    FetchResultItem:
      type: object
      properties:
        sourceId: { type: integer, format: int64 }
        name: { type: string }
        written: { type: integer, description: 本次新写入条数；重复抓到的会因唯一索引被跳过而不计 }
        error: { type: string, description: 抓取失败原因；成功时为空 }

    QaAskReq:
      type: object
      required: [title, description]
      description: 故意不含 status / userId——让客户端决定这两个值等于交出发布权。
      properties:
        title: { type: string, minLength: 6, maxLength: 200, example: K8s Pod 一直 CrashLoopBackOff 怎么排查 }
        description: { type: string, minLength: 10, maxLength: 20000, description: 问题正文，越具体越容易得到有效回答 }
        attachments: { type: array, items: { type: string }, description: 附件地址（只接受 http/https） }
        skillIds: { type: array, items: { type: integer, format: int64 }, description: 技术标签 ID }

    QaAnswerReq:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 10, maxLength: 20000 }

    QaQuestionItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        excerpt: { type: string, description: 正文截断；列表不返回全文，一页 20 条全文会让响应翻几倍 }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        avatar: { type: string }
        authorRole: { type: string, enum: [user, expert, admin] }
        answerCount: { type: integer, format: int64, description: 只计已发布回答 }
        viewCount: { type: integer, format: int64 }
        status: { type: string, enum: [open, resolved, closed] }
        skillIds: { type: array, items: { type: integer, format: int64 } }
        createdAt: { type: string, format: date-time }
        lastAnswerAt: { type: string, format: date-time, nullable: true, description: 列表排序键 }
        acceptedAt: { type: string, format: date-time, nullable: true }
        hasAccepted: { type: boolean, description: 画「已解决」徽标请用这个，不要拿 status != open 猜 }

    QaAnswerItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        questionId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        avatar: { type: string }
        contributionPoints: { type: integer, format: int64, description: 作者贡献积分（展示用） }
        badge: { type: string, description: '新手 / 活跃 / 贡献者 / 资深贡献者' }
        authorRole: { type: string, enum: [user, expert, admin] }
        isExpert: { type: boolean, description: 已过审专家的显式标记，仅作展示，不是权限 }
        content: { type: string }
        score: { type: integer, format: int64 }
        isAccepted: { type: boolean }
        liked: { type: boolean, description: 当前访问者是否点过赞，未登录恒为 false }
        status: { type: string, enum: [pending, published, rejected] }
        reviewNote: { type: string, description: 仅在被驳回且查看者是作者时下发 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QaQuestionDetail:
      allOf:
        - $ref: '#/components/schemas/QaQuestionItem'
        - type: object
          properties:
            description: { type: string }
            attachments: { type: array, items: { type: string } }
            answers:
              type: array
              items: { $ref: '#/components/schemas/QaAnswerItem' }
            acceptedAnswerId: { type: integer, format: int64, description: 0 表示尚未采纳 }
            canAccept: { type: boolean, description: 服务端判定：本人是提问人且问题仍 open }
            canClose: { type: boolean }
            myAnswerId: { type: integer, format: int64, description: 非 0 表示我已答过，页面应切到编辑态 }

    QaListPage:
      allOf:
        - $ref: '#/components/schemas/PageData'
        - type: object
          properties:
            list:
              type: array
              items: { $ref: '#/components/schemas/QaQuestionItem' }
            stats: { $ref: '#/components/schemas/QaStats' }

    QaStats:
      type: object
      description: 全局统计（待解答 / 已解决 / 已发布回答数），与登录无关；仅列表第一页下发。
      properties:
        open: { type: integer, format: int64 }
        resolved: { type: integer, format: int64 }
        answers: { type: integer, format: int64, description: 全站已发布回答总数 }

    QaReviewReq:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject] }
        note: { type: string, description: 驳回必填，只对作者可见 }

    QaAdminAnswerItem:
      allOf:
        - $ref: '#/components/schemas/QaAnswerItem'
        - type: object
          properties:
            questionTitle: { type: string, description: 审核时得能看到在回答什么问题 }

    QaAdminList:
      allOf:
        - $ref: '#/components/schemas/PageData'
        - type: object
          properties:
            list:
              type: array
              items: { $ref: '#/components/schemas/QaAdminAnswerItem' }

    QaToArticleReq:
      type: object
      properties:
        channel: { type: string, enum: [linux-tutorial], description: 省略为 linux-tutorial }
        categoryId: { type: integer, format: int64 }
        title: { type: string, description: 省略时用问题标题 }

    QaToArticleResp:
      type: object
      properties:
        articleId: { type: integer, format: int64 }
        slug: { type: string }
        editPath: { type: string, description: 后台编辑器路径，省前端一次拼接 }

    PointLogItem:
      type: object
      properties:
        action: { type: string, example: qa.answer_accepted }
        actionText: { type: string, example: 回答被采纳 }
        points: { type: integer, format: int64 }
        targetType: { type: string, example: answer }
        targetId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    MyPointsResp:
      type: object
      properties:
        points: { type: integer, format: int64 }
        badge: { type: string }
        nextBadge: { type: string, description: 已是最高级时省略 }
        nextAt: { type: integer, format: int64, description: 升级所需分数 }
        recent:
          type: array
          items: { $ref: '#/components/schemas/PointLogItem' }

    # ==================== 题目投稿与批量导入（十八） ====================

    QuizContributeReq:
      type: object
      description: |
        题目投稿。与后台录题（QuizQuestionCreateReq）的差别只有两点：
        没有 status 字段——是否发布由运营审核决定，不让客户端传状态；
        analysis 必填——没有解析的题，答错的人不知道错在哪。
      required: [stem, correct, analysis]
      properties:
        stem: { type: string, maxLength: 2000, minLength: 8 }
        type:
          type: string
          enum: [single, multiple, judge]
          default: single
        options:
          type: array
          description: 判断题省略，选项由服务端填「正确 / 错误」
          minItems: 2
          maxItems: 8
          items: { $ref: '#/components/schemas/QuizOptionInput' }
        correct:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string }
        analysis: { type: string, maxLength: 4000, description: 必填。说明正确答案为什么对、干扰项错在哪 }
        difficulty: { type: string, enum: [easy, medium, hard], default: medium }
        categoryId: { type: integer, format: int64 }
        tags: { type: array, items: { type: string }, maxItems: 5 }

    QuizContributeResp:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending], description: 固定待审核，接口不会直接发布 }

    QuizReviewReq:
      type: object
      description: 题目投稿的审核动作。状态流转用 CAS（WHERE status=pending），两个管理员同时点通过时第二个落空。
      required: [action]
      properties:
        action: { type: string, enum: [pass, reject] }
        note:
          type: string
          maxLength: 200
          description: 驳回必填，原样展示给投稿人；通过时忽略

    QuizImportReq:
      type: object
      description: |
        批量导入的题数组。单次上限 200 条——上限不是为性能，
        是让「整体失败」仍然可用：再多就该拆文件了。
        校验规则与单题录入完全一致，不会因为走导入就少校验几项。
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/QuizQuestionCreateReq' }

    QuizImportError:
      type: object
      description: 一行的校验错误。行号从 1 起，对应请求体数组下标 +1。
      properties:
        row: { type: integer, example: 2 }
        stem: { type: string, description: 该行题干的前 30 字，方便在表格里对上行 }
        message: { type: string, example: 正确答案 C 不在选项列表里 }

    QuizImportResult:
      type: object
      description: |
        全量校验后一次落库：任一行有问题则一条都不写（Imported=0），
        错误一次给全，运营改完重传即可，不会产生重复数据。
      properties:
        total: { type: integer, description: 提交的总行数 }
        imported: { type: integer, description: 实际写入条数；全部成功才等于 total }
        errors:
          type: array
          items: { $ref: '#/components/schemas/QuizImportError' }

    # ==================== 系统教程集（十九） ====================

    ToolChapterItem:
      type: object
      description: 教程集目录里的一个节点。两级封顶：顶层是章，章下是节。
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 200 }
        articleId: { type: integer, format: int64, description: 站内正文文章 ID；与 url 最多一个非空 }
        articleSlug: { type: string, description: '前端据此跳 #/article/{slug}' }
        url: { type: string, description: 站外文档链接；关联站内文章时为空 }
        summary: { type: string, description: 一句话导语，列表里显示在标题下 }
        sort: { type: integer }
        broken:
          type: boolean
          description: 正文已失效（文章被删或下线）。前台直接跳过，后台保留并标红——看不到就改不了
        children:
          type: array
          description: 章下的节。树结构由服务端拼好，调用方不必再按 parentId 组装
          items: { $ref: '#/components/schemas/ToolChapterItem' }

    ToolBookItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        toolId: { type: integer, format: int64 }
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        cover: { type: string }
        level: { type: string, enum: [beginner, advanced, expert] }
        status: { type: string, enum: [draft, pending, published, rejected, offline] }
        sort: { type: integer }
        chapterCount:
          type: integer
          description: 只算可见节点（失效文章不计），用于「共 12 节」这类文案
        publishedAt: { type: string, format: date-time, nullable: true }
        chapters:
          type: array
          description: 完整目录树。列表页可以不带，详情页一定带
          items: { $ref: '#/components/schemas/ToolChapterItem' }

    ToolBookDetail:
      allOf:
        - $ref: '#/components/schemas/ToolBookItem'
        - type: object
          properties:
            toolName: { type: string, description: 所属工具名，面包屑与「回到工具页」用 }
            toolSlug: { type: string }

    ToolBookCreateReq:
      type: object
      description: 没有 status 字段——新建一律草稿，上线走发布接口。
      required: [title]
      properties:
        title: { type: string, maxLength: 120 }
        summary: { type: string, maxLength: 300 }
        cover: { type: string, maxLength: 512 }
        level: { type: string, enum: [beginner, advanced, expert], default: beginner }
        sort: { type: integer }

    ToolBookUpdateReq:
      type: object
      description: 指针字段语义为「未传即不改」
      properties:
        title: { type: string, maxLength: 120 }
        summary: { type: string, maxLength: 300 }
        cover: { type: string, maxLength: 512 }
        level: { type: string, enum: [beginner, advanced, expert] }
        sort: { type: integer }

    ToolChapterOutlineReq:
      type: object
      description: |
        用大纲文本整体替换目录。为什么是文本框而不是拖拽编辑器：
        运维教程的大纲本来就在文档里写好（「第一章 / 1.1 / 1.2」），
        文本框可以整段粘进来；整体替换也天然避免「删了章、它的节还挂着
        指向空气的 parent_id」这种中间态。

        格式：
          # 第一章 安装与配置
          ## 1.1 编译安装 | nginx-compile | 一句话导语
          ## 1.2 目录结构 | nginx-dirs
          # 第二章 反向代理
          ## 2.1 upstream | https://nginx.org/en/docs/http/ngx_http_upstream_module.html

        分隔符是竖线（全角｜也接受）。第二列可以是站内文章 slug 或 http(s) 外链，第三列导语可省略。
      properties:
        outline: { type: string, description: 大纲文本；空串表示清空目录 }

    ToolChapterOutlineResult:
      type: object
      properties:
        chapters:
          type: array
          description: 保存后回读的树，前端直接渲染，不必再请求一次
          items: { $ref: '#/components/schemas/ToolChapterItem' }
        count: { type: integer, description: 节点总数（章 + 节） }
        warnings:
          type: array
          description: |
            不导致保存失败、但运营需要知道的问题：某行格式不合法被忽略、
            某个 slug 找不到文章（按无正文保留标题处理）。
          items: { type: string }

    ToolChapterOutlineDoc:
      type: object
      description: 后台编辑页回填用
      properties:
        outline: { type: string }
        count: { type: integer, description: 便于前端在空目录时给引导文案 }
