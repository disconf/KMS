  # ============================ 知识库后台：资源下载 ============================

  /api/v1/admin/kb/resources:
    get:
      tags: [admin-kb]
      summary: 后台资源列表
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, offline] } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/AdminResourceItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-kb]
      summary: 新建资源
      description: |
        先调 `POST /upload`（`scene=resource_file`）拿到 `fileKey`，再提交本接口。

        `fileKey` 必须来自 `resource_file` 场景——服务端会做前缀校验，
        防止用资质证书之类的私有 key 冒充公开资源（业务码 40030）。

        `fileSize` 与 `checksum` **不采信客户端传值**，一律从落盘内容实测
        （流式 SHA256，不把文件读进内存）。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceCreateReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminResourceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/resources/{id}:
    get:
      tags: [admin-kb]
      summary: 资源编辑态详情
      description: 相比前台详情多回显 `fileKey`，便于替换文件。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminResourceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 更新资源
      description: 传了 `fileKey` 才做文件替换，并重新实测大小与校验和。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceUpdateReq' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminResourceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-kb]
      summary: 删除资源
      description: |
        先查该文件是否被其它资源引用（`ExtExists`），确认无引用才删物理文件——
        否则多个资源指向同一份文件时，删一个会把其余的一起弄成死链。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/kb/resources/{id}/publish:
    post:
      tags: [admin-kb]
      summary: 发布资源
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminResourceDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/resources/{id}/offline:
    post:
      tags: [admin-kb]
      summary: 下线资源
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 下线成功 }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============================ 知识库后台：运维题库 ============================

  /api/v1/admin/kb/quiz/questions:
    get:
      tags: [admin-kb]
      summary: 后台题目列表
      description: 相比前台列表多返回 `correct` 与 `analysis`——后台就是要看见答案才能改。
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, offline] } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/AdminQuizItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-kb]
      summary: 录入题目
      description: |
        录入规则（违反均返回 40023）：

        - 选项个数 2–8，key 必须唯一
        - `judge` 判断题的选项固定为 `A=正确 / B=错误`，不允许自由录入
        - `correct` 必须是已声明选项 key 的子集
        - 单选与判断题只能有一个正确答案
        - **多选题的正确答案不能覆盖全部选项**，否则题目失去区分度
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizQuestionCreateReq' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminQuizItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/quiz/questions/{id}:
    get:
      tags: [admin-kb]
      summary: 题目编辑态详情
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminQuizItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 更新题目
      description: 校验规则与录入一致；改选项时 `correct` 会按新选项集重新校验。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizQuestionUpdateReq' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminQuizItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-kb]
      summary: 删除题目
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除成功 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/kb/quiz/questions/{id}/publish:
    post:
      tags: [admin-kb]
      summary: 发布题目
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminQuizItem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/quiz/questions/{id}/offline:
    post:
      tags: [admin-kb]
      summary: 下线题目
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 下线成功 }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/quiz/questions/import:
    post:
      tags: [admin-kb]
      summary: 批量导入题目
      description: |
        全量校验后一次落库：任一行有问题则一条都不写，错误带行号一次给全。
        导入的题一律先落草稿——批量灌进来的题没人逐条看过，
        直接 published 等于把未检查的内容推给刷题用户。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizImportReq' }
      responses:
        '200':
          description: 校验结果（有错误行也返回 200，错误明细在 data.errors 里）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/admin/kb/quiz/questions/{id}/review:
    post:
      tags: [admin-kb]
      summary: 审核投稿的题
      description: |
        通过则发布并给投稿人计 5 贡献分（只记一次，重复审核不会重复加分）；
        驳回必填原因。状态流转用 CAS（WHERE id=? AND status='pending'），
        两个管理员同时点通过时第二个命中 0 行并报「已被其他人处理」。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizReviewReq' }
      responses:
        '200':
          description: 审核完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminQuizItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============================ 系统教程集 ============================

  /api/v1/admin/kb/tools/{id}/books:
    get:
      tags: [admin-kb]
      summary: 工具的教程集列表（含草稿与失效节点）
      description: 后台版不做失效过滤——运营得看到哪一条挂了才能修。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 工具 ID }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ToolBookItem' }
    post:
      tags: [admin-kb]
      summary: 新建教程集
      description: 固定落草稿；目录为空的书不允许发布。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 工具 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolBookCreateReq' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolBookItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/kb/tool-books/{id}:
    get:
      tags: [admin-kb]
      summary: 教程集详情（后台）
      description: 保留失效节点并标 broken，后台要能看到哪条挂了。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolBookDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 更新教程集信息
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolBookUpdateReq' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolBookItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-kb]
      summary: 删除教程集
      description: 章节在一个事务里一并物理删除——目录是整体替换的结构，不保留孤儿节点。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/kb/tool-books/{id}/publish:
    post:
      tags: [admin-kb]
      summary: 发布教程集
      description: 目录为空时拒绝发布（409）——空书挂到前台是一个空壳标题。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolBookItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/tool-books/{id}/offline:
    post:
      tags: [admin-kb]
      summary: 下线教程集
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolBookItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/kb/tool-books/{id}/outline:
    get:
      tags: [admin-kb]
      summary: 读取章节大纲文本
      description: 把现有目录导出成大纲文本回填编辑框，避免「以为这本书没有目录」。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolChapterOutlineDoc' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-kb]
      summary: 保存章节大纲（整体替换）
      description: |
        格式见 ToolChapterOutlineReq。解析不出正文引用的行会保留标题并记入 warnings，
        不阻断保存——某篇文章被下线不该让整份目录存不进去。
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolChapterOutlineReq' }
      responses:
        '200':
          description: 保存结果（含回读的树与警告）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ToolChapterOutlineResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================ 文件上传 ============================


  /api/v1/upload/scenes:
    get:
      tags: [upload]
      summary: 上传场景与限制
      description: |
        返回全部上传场景及其限制（大小上限、允许的 MIME、是否私有），
        供前端做前置校验与文案提示，以及直接生成 `<input type="file" accept="...">`。

        场景清单是静态能力说明，不含任何用户数据，因此公开。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/UploadSceneItem' }
                          driver: { type: string, description: 当前存储驱动, example: local }

  /api/v1/upload:
    post:
      tags: [upload]
      summary: 上传文件
      description: |
        表单字段固定为 `file`，场景通过 `scene` 字段传入。

        请求体上限 60MB，取略大于最大场景上限（资源文件 50MB）：超出的请求在进入
        multipart 解析前就被截断，不会先被读进内存再拒绝。

        服务端按文件魔数校验真实类型，不采信客户端声明的 Content-Type 与扩展名。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [scene, file]
              properties:
                scene:
                  type: string
                  description: 上传场景，取值见 /upload/scenes
                  example: resource_file
                file: { type: string, format: binary }
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UploadResult' }
        '400':
          description: 缺少文件、场景不存在、超出大小或类型不符（业务码 7xxxx）
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/files:
    get:
      tags: [upload]
      summary: 下载私有文件
      description: |
        `key` 与 `exp`/`sig` 由上游接口（如资源下载、专家资质回显）签发，前端不应自行拼接。

        本接口刻意不要求登录：私有文件的地址要能直接塞进 `<img src>`，
        浏览器的图片请求带不上 `Authorization` 头，这里的凭证就是 URL 上的签名。
        签名被篡改返回 70005。
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, schema: { type: integer, format: int64 }, description: 失效时间戳（秒） }
        - { name: sig, in: query, schema: { type: string }, description: HMAC 签名 }
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: 缺少参数或签名不合法（业务码 70005） }

  # ============================ 专家域：公开展示 ============================

  /api/v1/experts:
    get:
      tags: [expert]
      summary: 专家列表
      description: '只返回已通过审核的专家。`sort=rating` 为默认排序。'
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: skillId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: minPriceCents, in: query, schema: { type: integer, format: int64 } }
        - { name: maxPriceCents, in: query, schema: { type: integer, format: int64 } }
        - { name: onlineOnly, in: query, schema: { type: boolean } }
        - { name: minRating, in: query, schema: { type: number, format: double } }
        - { name: sort, in: query, schema: { type: string, enum: [rating, orders, price_asc, price_desc, latest], default: rating } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/ExpertCard' }

  /api/v1/experts/{id}:
    get:
      tags: [expert]
      summary: 专家详情
      description: 刻意不含余额、累计收入等财务字段——那是只有本人能看的数据。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpertDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/experts/{id}/reviews:
    get:
      tags: [expert]
      summary: 专家公开评价
      description: >-
        与详情接口分开：评价要能「加载更多」，塞进详情会让首屏返回体随评价数增长。
        汇总（总数 / 均分 / 好评率 / 星级分布）跟着这一页一起下发，前端不必再请求一次。
        匿名评价在服务端就把昵称与头像换成「匿名用户」，订单号与用户 ID 一概不下发。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExpertReviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/skills:
    get:
      tags: [expert]
      summary: 技能字典
      description: 返回全部技能项及已入驻专家数，供筛选器与申请表单使用。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Body'
                  - type: object
