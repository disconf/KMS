# 生产环境 HTTPS 反代。
#
# 80 只做跳转：所有明文请求 301 到域名对应的 HTTPS 地址。
# 用域名而不是 $host 做跳转目标是刻意的——
# 用 IP 或异常 Host 扫上来的流量不该被带着走到 HTTPS，统一收口到正式域名。
#
# 证书挂载自宿主机 /etc/nginx/ssl（compose 只读挂载）。
# 有效期到 2026-11-03，续期后 docker compose restart nginx 即可，无需重建。

# HTTP：跳 HTTPS，仅给 ACME 续期留路径
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jinzhiqiang.com$request_uri;
    }
}

# HTTPS：正式入口
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jinzhiqiang.com jinzhiqiang.com;

    ssl_certificate     /etc/nginx/ssl/www.jinzhiqiang.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.jinzhiqiang.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 上传上限 60M：应用层限制单文件 50M，网关留出余量
    client_max_body_size 60m;
    client_body_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 安全响应头。不用 CSP：SPA + 内联样式较多，先收住最基础的几条。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 静态资源：文件名不带内容哈希，不能用长强缓存——
    # 否则发新版后老访客最长 7 天拿不到新 JS（注册页签没出现就是这么来的）。
    # 改协商缓存：命中走 304，更新立即生效。
    location /assets/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # 动态与入口页：回源应用
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
